components:
  schemas:
    DellServiceRoot_v1_1_0_DellServiceRoot:
      additionalProperties: false
      description: This is the complex property is for the additional OEM properties
        to complement DMTF ServiceRoot Schema.
      properties:
        DellAttributes:
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_idRef
          description: A reference to a DellAttributes resource.
          readOnly: true
          x-longDescription: A reference to a DellAttributes resource.
          x-versionAdded: v1_1_0
        IsBranded:
          description: Property to represent OEM system as DELL.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: The value of the property identifies OEM system as DELL.
        LicenseClass:
          description: Property to represent the license class of the system.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of the property specifies the license class
            of the system (e.g., Enterprise, Express, Base).
          x-versionAdded: v1_1_0
        ManagerMACAddress:
          description: Property to represent MAC Address of the iDRAC.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of the property represents MAC Address of the
            iDRAC.
        ServiceTag:
          description: Property to represent ServiceTag of Computer System.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of the property specifies the system service
            tag.
        SystemModelName:
          description: Property represent the System Model Name
          nullable: true
          readOnly: true
          type: string
          x-versionAdded: v1_1_0
      type: object
      x-longDescription: This is the complex property is for the additional OEM properties
        to complement DMTF ServiceRoot Schema. This shall be used to represent an
        OEM Service Root for a Redfish implementation.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
