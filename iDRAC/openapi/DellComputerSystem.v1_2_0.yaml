    DellComputerSystem_v1_2_0_BootStatus:
      enum:
      - None
      - UEFI
      - Reset
      - Firmware
      - OSBooting
      - OSRunning
      - OSHalted
      - OSUpdating
      - OSCrashDumpInProgress
      - OSCrashDumpCompleted
      - Fault
      - FaultComplete
      type: string
      x-enumDescriptions:
        Fault: Hardware or Software fault.
        FaultComplete: Hardware or Software fault complete.
        Firmware: Boot status is firmware.
        None: Boot status is unknown.
        OSBooting: OS is booting.
        OSCrashDumpCompleted: OS Crash dump is complete.
        OSCrashDumpInProgress: OS Crash dump in progress.
        OSHalted: OS is halted.
        OSRunning: OS is running.
        OSUpdating: OS update in progess.
        Reset: DPU is resetting.
        UEFI: Boot status is UEFI.
      x-enumLongDescriptions:
        Fault: Hardware or Software fault.
        FaultComplete: Hardware or Software fault complete.
        Firmware: Boot status is firmware. CPU has passed firmware checkpoint.
        None: Boot status is unknown.
        OSBooting: OS is booting.
        OSCrashDumpCompleted: OS Crash dump is complete.
        OSCrashDumpInProgress: OS Crash dump in progress.
        OSHalted: OS is halted or shutdown.
        OSRunning: OS is running.
        OSUpdating: OS update in progress.
        Reset: Boot status is reset (CPU is in reset / Boot ROM).
        UEFI: Boot status is UEFI.
