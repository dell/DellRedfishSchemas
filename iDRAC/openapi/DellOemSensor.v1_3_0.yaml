          description: This property shall specify a valid odata or Redfish property.
      x-versionAdded: v1_3_0
    DellOemSensor_v1_3_0_GetHistoricalThermalReadingsRequestBody:
      additionalProperties: false
      description: An action to retrieve historical readings of the thermal Sensor.
      properties:
        ReadingHistoryPeriod:
