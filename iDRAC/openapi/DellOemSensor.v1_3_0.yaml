    DellOemSensor_v1_3_0_DellOemSensor:
      additionalProperties: false
      description: This is the complex property for the additional OEM properties
        to complement DMTF Sensor Schema.
      properties:
        AverageReadings:
          $ref: '#/components/schemas/DellOemSensor_v1_3_0_AggregatedReadings'
          description: An aggregation of averages of readings.
          nullable: true
          readOnly: true
          x-longDescription: An aggregation of averages of readings.
          x-versionAdded: v1_1_0
        CurrentState:
          description: The current state indicated by the Sensor. This value is always
            one of the PossibleStates.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The current state indicated by the Sensor. This value
            is always one of the PossibleStates.
        DeviceID:
          description: An address or other identifying information to uniquely name
            the LogicalDevice.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: An address or other identifying information to uniquely
            name the LogicalDevice.
        DurationInCriticalThresholdPercent:
          description: The duration spent beyond the critical thresholds in percent.
          nullable: true
          readOnly: true
          type: number
          x-longDescription: The duration spent beyond the critical thresholds in
            percent.
          x-versionAdded: v1_1_0
        DurationInWarningThresholdPercent:
          description: The duration spent beyond the warning thresholds in percent.
          nullable: true
          readOnly: true
          type: number
          x-longDescription: The duration spent beyond the warning thresholds in percent.
          x-versionAdded: v1_1_0
        HistoricalReadings:
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_idRef
          description: A resource representation of HistoricalReadings.
          readOnly: true
          x-longDescription: A resource representation of HistoricalReadings.
          x-versionAdded: v1_1_0
        LowestReadings:
          $ref: '#/components/schemas/DellOemSensor_v1_3_0_AggregatedReadings'
          description: An aggregation of readings with the lowest value.
          nullable: true
          readOnly: true
          x-longDescription: An aggregation of readings with the lowest value.
          x-versionAdded: v1_1_0
        PeakReadings:
          $ref: '#/components/schemas/DellOemSensor_v1_3_0_AggregatedReadings'
          description: An aggregation of readings with the highest value.
          nullable: true
          readOnly: true
          x-longDescription: An aggregation of readings with the highest value.
          x-versionAdded: v1_1_0
        PossibleStates:
          description: PossibleStates enumerates the string outputs of the Sensor.
            For example, a "Switch" Sensor may output the states "On", or "Off". Another
            implementation of the Switch may output the states "Open", and "Close".
            Another example is a NumericSensor that supports thresholds. This sensor
            can report states such as "Normal", "Upper Fatal", "Lower Non-Critical",
            and so on. A NumericSensor that does not publish readings and thresholds,
            but stores this data internally, can still report its states.
          items:
            nullable: true
            type: string
          readOnly: true
          type: array
          x-longDescription: PossibleStates enumerates the string outputs of the Sensor.
            For example, a "Switch" Sensor may output the states "On", or "Off". Another
            implementation of the Switch may output the states "Open", and "Close".
            Another example is a NumericSensor that supports thresholds. This sensor
            can report states such as "Normal", "Upper Fatal", "Lower Non-Critical",
            and so on. A NumericSensor that does not publish readings and thresholds,
            but stores this data internally, can still report its states.
        RequestedState:
          $ref: https://raw.githubusercontent.com/dell/DellRedfishSchemas/refs/heads/main/iDRAC/DellNumericSensor.yaml#/components/schemas/DellNumericSensor_RequestedState
          description: RequestedState is an integer enumeration that indicates the
            last requested or desired state for the element, irrespective of the mechanism
            through which it was requested.
          nullable: true
          readOnly: true
          x-longDescription: RequestedState is an integer enumeration that indicates
            the last requested or desired state for the element, irrespective of the
            mechanism through which it was requested.
        TotalOperationalDuration:
          description: The duration of Operational days.
          nullable: true
          pattern: ^P(\d+D)?(T(\d+H)?(\d+M)?(\d+(.\d+)?S)?)?$
          readOnly: true
          type: string
          x-longDescription: The duration of total Operational days.
          x-versionAdded: v1_1_0
      type: object
      x-longDescription: This is the complex property for the additional OEM properties
        to complement DMTF Sensor Schema. This shall be used to represent an OEM Sensor
        for a Redfish implementation.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellOemSensor_v1_3_0_GetHistoricalSensorReadings:
      additionalProperties: false
