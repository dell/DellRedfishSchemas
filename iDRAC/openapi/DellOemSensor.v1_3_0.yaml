    DellOemSensor_v1_3_0_AggregatedReading:
      additionalProperties: false
      properties:
        AveragingIntervalAchieved:
          description: Set to true if the averaging interval has been achieved.
          nullable: true
          readOnly: true
          type: boolean
          x-longDescription: Set to true if the averaging interval has been achieved.
            This property is only present if the reading is an average.
          x-versionAdded: v1_1_0
        Reading:
          description: The value of the reading.
          nullable: true
          readOnly: true
          type: number
          x-longDescription: The value of the reading. The unit is the same as the
            ReadingUnits.
          x-versionAdded: v1_1_0
        ReadingTime:
          description: The time of the reading.
          format: date-time
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The time of the reading. It is not applicable if the
            reading is an average.
          x-versionAdded: v1_1_0
      type: object
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
