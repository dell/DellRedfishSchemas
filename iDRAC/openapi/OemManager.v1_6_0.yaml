    OemManager_v1_6_0_GetRedfishResources:
      additionalProperties: false
      description: Retrieve Redfish resources for a set of endpoints, possibly using
        wildcards.
      properties:
        target:
          description: Link to invoke action
          format: uri-reference
          type: string
        title:
          description: Friendly action name
          type: string
      type: object
      x-longDescription: This action retrieves the Redfish resources for the specified
        endpoints. The action supports wildcard expansion and may return partial results
        if the operation exceeds the specified timeout or MaxURIs limit. Only one
        GetRedfishResources request can execute at a time; concurrent requests are
        rejected with HTTP 429.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    OemManager_v1_6_0_GetRedfishResourcesRequestBody:
      additionalProperties: false
      description: Retrieve Redfish resources for a set of endpoints, possibly using
        wildcards.
      properties:
        EndPoints:
          description: A collection of Redfish URI paths or wildcard patterns to retrieve.
            Each entry must start with /redfish/ and must not contain '?', '#', '[',
            ']', '%', or end with '/SSE'. Wildcard matching using a single asterisk
            (*) is supported at multiple path levels (for example, /redfish/v1/Systems/*/Processors/*).
            URIs served by Auxiliary Management Controllers (AMCs) do not support
            wildcard matching and must be specified explicitly. DellAttributes, TelemetryService,
            Registries, JsonSchemas, and Schemas (including their subordinate resources)
            are not supported by this action. Log entry instances under /Entries/
            segments are not supported; log entries should be accessed through their
            parent LogService resource. Invalid or unsupported endpoints are reported
            in FailedEndPoints. Trailing slashes are automatically removed.
          items:
            type: string
          type: array
          x-longDescription: A collection of Redfish URI paths or wildcard patterns
            to retrieve. Each entry must start with /redfish/ and must not contain
            '?', '#', '[', ']', '%', or end with '/SSE'. Wildcard matching using a
            single asterisk (*) is supported at multiple path levels (for example,
            /redfish/v1/Systems/*/Processors/*). URIs served by Auxiliary Management
            Controllers (AMCs) do not support wildcard matching and must be specified
            explicitly. DellAttributes, TelemetryService, Registries, JsonSchemas,
            and Schemas (including their subordinate resources) are not supported
            by this action. Log entry instances under /Entries/ segments are not supported;
            log entries should be accessed through their parent LogService resource.
            Invalid or unsupported endpoints are reported in FailedEndPoints. Trailing
            slashes are automatically removed.
        MaxURIs:
          description: Maximum number of expanded URIs the service will process.
          format: int64
          maximum: 200
          minimum: 1
          type: integer
          x-longDescription: After wildcard expansion, the service will process at
            most this many URIs. Any additional URIs will be returned in PendingEndpoints
            for subsequent requests.
        TimeoutSeconds:
          description: Maximum time allowed to resolve all URIs. If exceeded, the
            action returns partial data.
          format: int64
          maximum: 30
          minimum: 1
          type: integer
          x-longDescription: If the operation exceeds this timeout, the action returns
            partial results along with PendingEndpoints so the remaining endpoints
            can be retried.
          x-units: s
      required:
      - EndPoints
      type: object
      x-longDescription: This action retrieves the Redfish resources for the specified
        endpoints. The action supports wildcard expansion and may return partial results
        if the operation exceeds the specified timeout or MaxURIs limit. Only one
        GetRedfishResources request can execute at a time; concurrent requests are
        rejected with HTTP 429.
    OemManager_v1_6_0_GetRedfishResourcesResponse:
      additionalProperties: false
      properties:
        Data:
          $ref: '#/components/schemas/OemManager_v1_6_0_RedfishResourceData'
          description: A key-value dictionary where keys are exact Redfish URIs and
            values are the JSON data.
          x-longDescription: This property shall contain a mapping of Redfish resource
            URIs to the retrieved JSON payloads.
          x-versionAdded: v1_6_0
        FailedEndPoints:
          description: The URLs that could not be retrieved.
          items:
            type: string
          type: array
          x-longDescription: This property shall contain the URLs that could not be
            retrieved due to errors. This includes URIs that do not conform to Redfish
            URI requirements or failed to fetch due to non-timeout errors.
          x-versionAdded: v1_6_0
        PendingEndpoints:
          description: If the action returned partial data, the remaining URLs can
            be retried using these values.
          items:
            type: string
          type: array
          x-longDescription: In case the action returned partial results, this property
            shall contain the URLs that can be passed back in EndPoints to fetch the
            remaining data.
          x-versionAdded: v1_6_0
      type: object
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
