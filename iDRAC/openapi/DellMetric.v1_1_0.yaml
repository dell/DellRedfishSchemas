components:
  schemas:
    DellMetric_v1_1_0_DellMetric:
      additionalProperties: false
      description: The DellMetric schema describes Dell metric metadata used for collecting
        and reporting metric data within the Redfish Service.
      properties:
        CustomLabel:
          description: Metric Custom Label shall override the default Label of the
            metric in the MetricReport.
          nullable: true
          type: string
          x-longDescription: The custom label is customized by the user.
          x-versionAdded: v1_1_0
        FQDD:
          description: The iDRAC standard FQDD of the device producing the metric.
          nullable: true
          type: string
          x-longDescription: The value of this property is the iDRAC standard FQDD
            of the device producing the metric. Available FQDDs for this property
            can be found at /redfish/v1/TelemetryService FQDDList property.
        Source:
          description: Source can be used to collect metrics.  /redfish/v1/TelemetryService
            holds the available Source list that can be used to collect Metrics.
          nullable: true
          type: string
          x-longDescription: Available sources can be found at /redfish/v1/TelemetryService
            in property SourceList.
      type: object
      x-longDescription: The schema describes property additions to the Metrics within
        the MetricReportDefinition.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
title: '#DellMetric.v1_1_0'
