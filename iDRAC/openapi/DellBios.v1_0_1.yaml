    DellBios_v1_0_1_SetBiosTime:
      additionalProperties: false
      description: Sets the BIOS time to a specified value. This action allows the
        user to configure the system clock and ensure that the BIOS is synchronized
        with the current time. If @Redfish.OperationApplyTime is not passed, by default
        it will be set to OnReset
      properties:
        target:
          description: Link to invoke action
          format: uri-reference
          type: string
        title:
          description: Friendly action name
          type: string
      type: object
      x-longDescription: Sets the BIOS time to a specified value. This action allows
        the user to configure the system clock and ensure that the BIOS is synchronized
        with the current time. If @Redfish.OperationApplyTime is not passed, by default
        it will be set to OnReset
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellBios_v1_0_1_SetBiosTimeRequestBody:
      additionalProperties: false
      description: Sets the BIOS time to a specified value. This action allows the
        user to configure the system clock and ensure that the BIOS is synchronized
        with the current time. If @Redfish.OperationApplyTime is not passed, by default
        it will be set to OnReset
      properties:
        BiosDateTime:
          description: This property specifies the BIOS time that needs to be set.
            The BIOS time is the time that is stored in the computer's Basic Input/Output
            System (BIOS) and is used to keep track of the current time and date.
            The BIOS time is set in the format YYYY-MM-DDTHH:MM:SS+-HH:MM
          format: date-time
          type: string
          x-longDescription: This property specifies the BIOS time that needs to be
            set. The BIOS time is the time that is stored in the computer's Basic
            Input/Output System (BIOS) and is used to keep track of the current time
            and date. The BIOS time is set in the format YYYY-MM-DDTHH:MM:SS+-HH:MM
        DaylightSavingsEnabled:
          description: This property specifies whether Daylight Saving Time (DST)
            is enabled or not. DST is the practice of temporarily advancing clocks
            during the summer months by one hour so that people can make the most
            of the sunlight during their waking hours.
          type: boolean
          x-longDescription: This property specifies whether Daylight Saving Time
            (DST) is enabled or not. DST is the practice of temporarily advancing
            clocks during the summer months by one hour so that people can make the
            most of the sunlight during their waking hours.
      type: object
      x-longDescription: Sets the BIOS time to a specified value. This action allows
        the user to configure the system clock and ensure that the BIOS is synchronized
        with the current time. If @Redfish.OperationApplyTime is not passed, by default
        it will be set to OnReset
