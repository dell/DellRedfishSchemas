components:
  schemas:
    DellPrivilegeRegistry_v1_0_0_DellOperationPrivilege:
      additionalProperties: false
      description: Dell OEM extension for OperationPrivilege with payload matching.
      properties:
        PayloadMatchRules:
          $ref: '#/components/schemas/DellPrivilegeRegistry_v1_0_0_PayloadMatchRules'
          description: Rules for matching request payload properties to determine
            privilege requirements.
          x-longDescription: This property shall contain rules for matching request
            payload properties. An empty object indicates a default entry that matches
            any payload not caught by specific rules. Non-empty rules apply only if
            all specified conditions match (AND logic).
      type: object
      x-longDescription: This type provides Dell OEM extension for OperationPrivilege
        with payload-based privilege matching rules.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellPrivilegeRegistry_v1_0_0_MatchCriteria:
      additionalProperties: false
      description: Matching criteria for a single payload property.
      properties:
        ExactMatch:
          description: Matches if the payload property value exactly equals this value.
          nullable: true
          type: string
          x-longDescription: This property shall contain the exact value to match
            against the payload property. The match succeeds if the payload property
            value equals this value.
        Exists:
          description: Matches based on whether the payload property exists.
          nullable: true
          type: boolean
          x-longDescription: If true, the match succeeds if the payload property exists
            (regardless of value). If false, the match succeeds if the payload property
            does not exist.
        GreaterThan:
          description: Matches if the payload property value is greater than this
            number.
          nullable: true
          type: number
          x-longDescription: This property shall contain a number. The match succeeds
            if the payload property value is greater than this number.
        GreaterThanOrEqual:
          description: Matches if the payload property value is greater than or equal
            to this number.
          nullable: true
          type: number
          x-longDescription: This property shall contain a number. The match succeeds
            if the payload property value is greater than or equal to this number.
        InRange:
          description: Matches if the payload property value is within the specified
            range [min, max].
          items:
            nullable: true
            type: number
          type: array
          x-longDescription: This property shall contain a two-element array [min,
            max]. The match succeeds if the payload property value is a number within
            this inclusive range.
        IsNull:
          description: Matches based on whether the payload property value is null.
          nullable: true
          type: boolean
          x-longDescription: If true, the match succeeds if the payload property value
            is null. If false, the match succeeds if the payload property value is
            not null.
        LessThan:
          description: Matches if the payload property value is less than this number.
          nullable: true
          type: number
          x-longDescription: This property shall contain a number. The match succeeds
            if the payload property value is less than this number.
        LessThanOrEqual:
          description: Matches if the payload property value is less than or equal
            to this number.
          nullable: true
          type: number
          x-longDescription: This property shall contain a number. The match succeeds
            if the payload property value is less than or equal to this number.
        NavigationUriOneOf:
          description: Matches if the payload property value matches any of the specified
            Redfish URI templates.
          items:
            nullable: true
            type: string
          type: array
          x-longDescription: This property shall contain an array of Redfish URI templates
            in OpenAPI format (e.g., '/redfish/v1/Managers/{ManagerId}/NetworkProtocol/HTTPS/Certificates/{CertificateId}').
            The match succeeds if the payload property value matches any of the URI
            patterns in the array.
        OneOf:
          description: Matches if the payload property value equals any value in this
            array.
          items:
            $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_OemObject
            nullable: true
          type: array
          x-longDescription: This property shall contain an array of allowed values.
            The match succeeds if the payload property value equals any value in this
            array.
        RegexMatch:
          description: Matches if the payload property value matches this regular
            expression pattern.
          nullable: true
          type: string
          x-longDescription: This property shall contain a regular expression pattern.
            The match succeeds if the payload property value (converted to string)
            matches this pattern.
      type: object
      x-longDescription: This type shall contain the matching criteria for a single
        payload property. Exactly one match operator should be specified.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellPrivilegeRegistry_v1_0_0_PayloadMatchRules:
      additionalProperties: true
      description: A set of payload property matching rules.
      properties: {}
      type: object
      x-longDescription: This type shall contain payload property matching rules.
        Each property name in this object corresponds to a property in the action
        request payload, and its value specifies the matching criteria. An empty object
        indicates a default entry that matches any payload.
      x-patternProperties:
        '[A-Za-z_][A-Za-z0-9_]*':
          $ref: '#/components/schemas/DellPrivilegeRegistry_v1_0_0_MatchCriteria'
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
title: '#DellPrivilegeRegistry.v1_0_0'
