components:
  schemas:
    DellProcessorMetrics_v1_1_0_DellProcessorMetrics:
      additionalProperties: false
      description: This property shall represent the Oem properties for a ProcessorMetrics
        resource.
      properties:
        CurrentPCIeLinkSpeed:
          description: The version of the PCIe specification in use by this device.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property shall contain the negotiated PCIe interface
            version in use by this device.
        DRAMUtilizationPercent:
          description: The memory Bandwidth utilization. DRAM usage as a percentage.
          minimum: 0
          nullable: true
          readOnly: true
          type: number
          x-longDescription: The memory Bandwidth utilization. DRAM usage as a percentage
            (relative to maximum theoretical bandwidth)
          x-units: '%'
        GPUResetRecommendedState:
          $ref: '#/components/schemas/DellProcessorMetrics_v1_1_0_ResetRecommendedState'
          description: The GPU ResetRecommendedState is shown.
          nullable: true
          readOnly: true
          x-longDescription: This property shall contain the GPU Reset RecommendedState.
          x-units: By
          x-versionAdded: v1_1_0
        MaxSupportedPCIeLinkSpeed:
          description: The highest version of the PCIe specification supported by
            this device.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property shall contain the maximum PCIe specification
            that this device supports.
        NVLinkRuntimeError:
          description: The NVLinkRuntimeError in Which  each bit represents training
            error.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: This property shall contain the NVLinkRuntimeError in
            hexadecimal string when converted to binary, each bit represents NVLink
            error status. If it is 0 menas no error and if it is 1 means error exist
            for the respective link.
          x-versionAdded: v1_1_0
        NVLinkRxThroughput:
          description: The NVLinkRxThroughput in KB.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property shall contain the NVLinkRxThroughput in
            KB.
          x-units: By
          x-versionAdded: v1_1_0
        NVLinkStatusFlag:
          description: The NVLinkStatusFlag represents flag status.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: This property shall contain the NVLinkStatusFlag in hexadecimal
            string when converted to binary, each bit represents NVLink flag status
            of recpective link. If bit is 0 then link is down ,if it is 1 then link
            is up.
          x-versionAdded: v1_1_0
        NVLinkTrainingError:
          description: The NVLinkTrainingError in Which  each bit represents training
            error.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: This property shall contain the NVLinkTrainingError in
            hexadecimal string when converted to binary, each bit represents NVLinkerror
            status. If it is 0 menas no error and if it is 1 means error exist for
            the respective link.
          x-versionAdded: v1_1_0
        NVLinkTxThroughput:
          description: The NVLinkTxThroughput in KB.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property shall contain the NVLinkTxThroughput in
            KB.
          x-units: By
          x-versionAdded: v1_1_0
        NVLinksCount:
          description: The NVLinksCount is count of current devices.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property shall contain the NVLinksCount is count
            of NVLinks for the current device.
          x-units: By
          x-versionAdded: v1_1_0
        PCIeRxThroughput:
          description: The PCIeRxThroughput shows Granularity in KB.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property shall contain the PCIeRxThroughput Granularity
            in KB.
          x-units: By
          x-versionAdded: v1_1_0
        PCIeTxThroughput:
          description: The PCIeTxThroughput shows Granularity in KB.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property shall contain the PCIeTxThroughput Granularity
            in KB.
          x-units: By
          x-versionAdded: v1_1_0
        PowerViolationDuration:
          description: The Power Violation Duration in nano seconds.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property shall contain the Power Violation Duration
            in nano seconds.
          x-units: By
          x-versionAdded: v1_1_0
        SWViolationDuration:
          description: The SWViolation Duration in nano seconds.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property shall contain the SWViolation Duration
            in nano seconds.
          x-units: By
          x-versionAdded: v1_1_0
        ThermalViolationDuration:
          description: The Thermal Violation Duration in nano seconds.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property shall contain the Thermal Violation Duration
            in nano seconds.
          x-units: By
          x-versionAdded: v1_1_0
      type: object
      x-longDescription: This property shall represent the Oem properties for a ProcessorMetrics
        resource.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellProcessorMetrics_v1_1_0_ResetRecommendedState:
      enum:
      - Reset is recommended
      - Reset is not recommended
      type: string
      x-enumDescriptions:
        Reset is not recommended: Reset is not recommended for the GPU
        Reset is recommended: Reset is recommended for the GPU
title: '#DellProcessorMetrics.v1_1_0'
