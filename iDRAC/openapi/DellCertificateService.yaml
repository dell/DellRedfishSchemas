      - $ref: https://raw.githubusercontent.com/dell/DellRedfishSchemas/refs/heads/main/iDRAC/DellCertificateService.v1_2_0.yaml#/components/schemas/DellCertificateService_v1_2_0_GenerateHPMCSR
