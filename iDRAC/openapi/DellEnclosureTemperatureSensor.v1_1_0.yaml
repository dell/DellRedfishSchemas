          description: Specifies if the units returned by this Sensor are rate units.
            All the values returned by this Sensor are represented in the units obtained
            by (BaseUnits * 10 raised to the power of the UnitModifier). This is true
            unless this property (RateUnits) has a value different than "None". For
            example, if BaseUnits is Volts and the UnitModifier is -6, the units of
