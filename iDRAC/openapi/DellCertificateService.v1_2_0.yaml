components:
  schemas:
    DellCertificateService_v1_2_0_Actions:
      additionalProperties: false
      properties:
        '#DellCertificateService.GenerateCSRAndImport':
          $ref: '#/components/schemas/DellCertificateService_v1_2_0_GenerateCSRAndImport'
        '#DellCertificateService.GenerateHPMCSR':
          $ref: '#/components/schemas/DellCertificateService_v1_2_0_GenerateHPMCSR'
        '#DellCertificateService.GetLastGeneratedCSR':
          $ref: '#/components/schemas/DellCertificateService_v1_2_0_GetLastGeneratedCSR'
      type: object
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellCertificateService_v1_2_0_GenerateCSRAndImport:
      additionalProperties: false
      description: This action generates Certificate Singing Request(CSR), signs and
        imports the singed certificate.
      properties:
        target:
          description: Link to invoke action
          format: uri-reference
          type: string
        title:
          description: Friendly action name
          type: string
      type: object
      x-longDescription: This action will generate a Certificate Singing Request(CSR),
        sign the certificate using the uploaded Custom Signing Certificate(CSC) and
        will import the singed certificate.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellCertificateService_v1_2_0_GenerateCSRAndImportRequestBody:
      additionalProperties: false
      description: This action generates Certificate Singing Request(CSR), signs and
        imports the singed certificate.
      properties:
        AlternativeNames:
          description: The additional host names of the component to secure.
          items:
            type: string
          type: array
          x-longDescription: This parameter shall contain an array of additional host
            names of the component to secure, as defined by the RFC5280 'subjectAltName'
            attribute.
        CertificateCollection:
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_idRef
          description: The link to the certificate collection where the certificate
            is installed after the certificate authority (CA) signs the certificate.
          x-longDescription: This parameter shall contain a link to a resource collection
            of type CertificateCollection where the certificate is installed after
            the certificate authority (CA) signs the certificate.
        City:
          description: The city or locality of the organization making the request.
          type: string
          x-longDescription: This parameter shall contain the city or locality of
            the organization making the request, as defined by the RFC5280 'localityName'
            attribute.
        CommonName:
          description: The fully qualified domain name of the component to secure.
          type: string
          x-longDescription: This parameter shall contain the fully qualified domain
            name of the component to secure, as defined by the RFC5280 'commonName'
            attribute.
        Country:
          description: The two-letter country code of the organization making the
            request.
          type: string
          x-longDescription: This parameter shall contain the two-letter ISO code
            for the country of the organization making the request, as defined by
            the RFC5280 'countryName' attribute.
        CustomSigningCertificate:
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_idRef
          description: The link to the Custom Sigining Certificate(CSC) which is used
            to sign the certificate.
          x-longDescription: This parameter shall contain a link the Custom Sigining
            Certificate(CSC) which is used to sign the certificate.
        Email:
          description: The email address of the contact within the organization making
            the request.
          type: string
          x-longDescription: This parameter shall contain the email address of the
            contact within the organization making the request, as defined by the
            RFC2985 'emailAddress' attribute.
        Organization:
          description: The name of the organization making the request.
          type: string
          x-longDescription: This parameter shall contain the name of the organization
            making the request, as defined by the RFC5280 'organizationName' attribute.
        OrganizationalUnit:
          description: The name of the unit or division of the organization making
            the request.
          type: string
          x-longDescription: This parameter shall contain the name of the unit or
            division of the organization making the request, as defined by the RFC5280
            'organizationalUnitName' attribute.
        State:
          description: The state, province, or region of the organization making the
            request.
          type: string
          x-longDescription: This parameter shall contain the state, province, or
            region of the organization making the request, as defined by the RFC5280
            'stateOrProvinceName' attribute.
      required:
      - CertificateCollection
      - City
      - CommonName
      - Country
      - CustomSigningCertificate
      - Organization
      - OrganizationalUnit
      - State
      type: object
      x-longDescription: This action will generate a Certificate Singing Request(CSR),
        sign the certificate using the uploaded Custom Signing Certificate(CSC) and
        will import the singed certificate.
    DellCertificateService_v1_2_0_GenerateHPMCSR:
      additionalProperties: false
      description: Generates a Certificate Signing Request (CSR) for a Hardware Platform
        Module (HPM).
      properties:
        target:
          description: Link to invoke action
          format: uri-reference
          type: string
        title:
          description: Friendly action name
          type: string
      type: object
      x-longDescription: This action generates a Certificate Signing Request (CSR)
        for the specified Hardware Platform Module (HPM). The resulting CSR can be
        submitted to a Certificate Authority (CA) for signing.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellCertificateService_v1_2_0_GenerateHPMCSRRequestBody:
      additionalProperties: false
      description: Generates a Certificate Signing Request (CSR) for a Hardware Platform
        Module (HPM).
      properties:
        HPMType:
          $ref: '#/components/schemas/DellCertificateService_v1_2_0_HPMType'
          description: The Hardware Platform Module type for which to generate the
            CSR.
          x-longDescription: This parameter shall specify whether to generate the
            CSR for the Primary or Secondary Hardware Platform Module.
        KeyCurveID:
          $ref: '#/components/schemas/DellCertificateService_v1_2_0_KeyCurveIDType'
          description: The elliptic curve to use for key generation.
          x-longDescription: This parameter shall specify the elliptic curve identifier
            used for key generation when an elliptic curve algorithm is selected.
        KeyPairAlgorithm:
          $ref: '#/components/schemas/DellCertificateService_v1_2_0_KeyPairAlgorithmType'
          description: The cryptographic algorithm to use for key pair generation.
          x-longDescription: This parameter shall specify the cryptographic algorithm
            used to generate the key pair for the certificate signing request.
      required:
      - HPMType
      - KeyCurveID
      - KeyPairAlgorithm
      type: object
      x-longDescription: This action generates a Certificate Signing Request (CSR)
        for the specified Hardware Platform Module (HPM). The resulting CSR can be
        submitted to a Certificate Authority (CA) for signing.
    DellCertificateService_v1_2_0_GenerateHPMCSRResponse:
      additionalProperties: false
      description: The response body for the GenerateHPMCSR action.
      properties:
        CSRString:
          description: The Privacy Enhanced Mail (PEM)-encoded certificate signing
            request.
          readOnly: true
          type: string
          x-longDescription: This property shall contain the PEM-encoded Certificate
            Signing Request (CSR) that can be submitted to a Certificate Authority
            (CA) for signing. The private key is not included.
          x-versionAdded: v1_2_0
        HPMType:
          $ref: '#/components/schemas/DellCertificateService_v1_2_0_HPMType'
          description: The Hardware Platform Module type for which the CSR was generated.
          readOnly: true
          x-longDescription: This property shall indicate whether the CSR was generated
            for the Primary or Secondary Hardware Platform Module.
          x-versionAdded: v1_2_0
      required:
      - HPMType
      - CSRString
      type: object
      x-longDescription: This type shall contain the properties found in the response
        body for the GenerateHPMCSR action.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellCertificateService_v1_2_0_GetLastGeneratedCSR:
      additionalProperties: false
      description: This action returns last generated CSR.
      properties:
        target:
          description: Link to invoke action
          format: uri-reference
          type: string
        title:
          description: Friendly action name
          type: string
      type: object
      x-longDescription: This action returns last generated CSR. The response will
        contain a signing request that a certificate authority (CA) will sign.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellCertificateService_v1_2_0_GetLastGeneratedCSRRequestBody:
      additionalProperties: false
      description: This action returns last generated CSR.
      properties:
        CertificateCollection:
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_idRef
          description: The link to the certificate collection where the certificate
            is expected to be installed after the certificate authority (CA) signs
            the certificate.
          x-longDescription: This parameter shall contain a link to a resource collection
            of type CertificateCollection where the certificate is expected to be
            installed after the certificate authority (CA) signs the certificate.
      required:
      - CertificateCollection
      type: object
      x-longDescription: This action returns last generated CSR. The response will
        contain a signing request that a certificate authority (CA) will sign.
    DellCertificateService_v1_2_0_GetLastGeneratedCSRResponse:
      additionalProperties: false
      description: The response body for the GetLastGeneratedCSR action.
      properties:
        CSRString:
          description: The string for the certificate signing request.
          readOnly: true
          type: string
          x-longDescription: This property shall contain the Privacy Enhanced Mail
            (PEM)-encoded string, which contains RFC2986-specified structures, of
            the certificate signing request.  The private key should not be part of
            the string.
        CertificateCollection:
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_idRef
          description: The link to the certificate collection where the certificate
            is expected to be installed.
          readOnly: true
          x-longDescription: This property shall contain a link to a resource collection
            of type CertificateCollection where the certificate is expected to be
            installed after the certificate authority (CA) has signed the certificate.
      required:
      - CertificateCollection
      - CSRString
      type: object
      x-longDescription: This type shall contain the properties found in the response
        body for the GetLastGeneratedCSR action.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellCertificateService_v1_2_0_HPMType:
      description: The type of Hardware Platform Module.
      enum:
      - Primary
      - Secondary
      type: string
      x-enumDescriptions:
        Primary: The Primary Hardware Platform Module.
        Secondary: The Secondary Hardware Platform Module.
      x-longDescription: This enumeration shall specify the type of Hardware Platform
        Module (HPM) used for certificate generation.
    DellCertificateService_v1_2_0_KeyCurveIDType:
      description: The elliptic curve used for key generation.
      enum:
      - TPM_ECC_NIST_P384
      type: string
      x-enumDescriptions:
        TPM_ECC_NIST_P384: NIST P-384 elliptic curve (384-bit), also known as secp384r1.
      x-longDescription: This enumeration shall specify the elliptic curve used for
        key generation when an elliptic curve algorithm is selected.
    DellCertificateService_v1_2_0_KeyPairAlgorithmType:
      description: The cryptographic algorithm used for key pair generation.
      enum:
      - TPM2_ALG_ECDSA
      type: string
      x-enumDescriptions:
        TPM2_ALG_ECDSA: Elliptic Curve Digital Signature Algorithm (ECDSA) as defined
          by TPM 2.0.
      x-longDescription: This enumeration shall specify the cryptographic algorithm
        used to generate the key pair for the certificate signing request.
title: '#DellCertificateService.v1_2_0'
