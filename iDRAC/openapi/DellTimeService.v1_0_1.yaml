    DellTimeService_v1_0_1_ManageTime:
      additionalProperties: false
      description: 'The DellTimeService.ManageTime() method is used to query the service
        processor time and to set the service processor time during the host system
        reboots and service processor resets. The service processor time set through
        the successful execution of this method is volatile and does not persist.
        The service processor time resets to the BIOS time at every reset of the host
        system or the service processor. Note: ManageTime method not supported on
        modular servers(MX840, MX740, etc) and also servers with NTP mode enabled.'
      properties:
        target:
          description: Link to invoke action
          format: uri-reference
          type: string
      type: object
      x-longDescription: 'The DellTimeService.ManageTime() method is used to query
