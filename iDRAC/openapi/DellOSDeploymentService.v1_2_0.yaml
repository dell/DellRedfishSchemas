    DellOSDeploymentService_v1_2_0_ConfigurableBootToNetworkISO:
      additionalProperties: false
      description: The ConfigurableBootToNetworkISO() method exposes an ISO Image
        present on a network share as a CDROM device to the host server for a specified
        exposure duration interval or by default for 18 hrs. Upon the successful execution,
        based on the ResetType parameter, the host system shall either immediately
        cold boot or warm boot. Upon this reset, the system shall then boot to the
        ISO Image. If ResetType specifies no immediate reboot, then upon the next
        host system reset, the system shall boot to the ISO Image. Furthermore, if
        immediate reset is not specified, then the system should be rebooted before
        the exposure duration interval expires, otherwise the system shall fail to
        boot to the ISO Image.
