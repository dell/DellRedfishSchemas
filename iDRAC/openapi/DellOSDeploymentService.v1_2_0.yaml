    DellOSDeploymentService_v1_2_0_ConnectNetworkISOImage:
      additionalProperties: false
      description: 'The ConnectNetworkISOImage() method is used to connect to the
        ISO present on the network share and expose the ISO as a local USB CD-ROM
        device to the host system. This method will connect to the ISO located on
        an NFS/CIFS share and expose it as a virtual CDROM device to the host server.
        Even though the successful method execution shall not change the boot order
        of that device, the host shall always boot to the virtual CDROM. Also note
        that after the ISO is exposed to the host server, Lifecycle Controller shall
        be locked and no other jobs like configuration/update etc shall be performed
        until the ISO is detached using the DisconnectNetworkISOImage() method. The
        successful exection of the DisconnectNetworkISOImage() shall revert the host
        system to the regular boot list. NOTE: The recommended methodology for connecting
        to an ISO image is by using the ConnectRFSISOImage()  method that utilizes
        the remote file system (RFS).'
      properties:
        target:
          description: Link to invoke action
          format: uri-reference
          type: string
      type: object
      x-longDescription: 'The ConnectNetworkISOImage() method is used to connect to
        the ISO present on the network share and expose the ISO as a local USB CD-ROM
        device to the host system. This method will connect to the ISO located on
        an NFS/CIFS share and expose it as a virtual CDROM device to the host server.
        Even though the successful method execution shall not change the boot order
