components:
  schemas:
    DellJob_v1_8_0_DellJob:
      additionalProperties: false
      description: This resource contains information about a specific configuration
        Job scheduled by or being executed by a Redfish service's Job Service.
      properties:
        '@odata.context':
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_context
        '@odata.etag':
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_etag
        '@odata.id':
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_id
        '@odata.type':
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_type
        ActualRunningStartTime:
          description: The time when a job moves into the Running state.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The actual running start time in Edm.DateTime format
            comes from when the job is moved into the running state. Zero is a legal
            value if the job never started running.
          x-versionAdded: v1_1_0
        ActualRunningStopTime:
          description: The time when the job left the running state.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The actual running stop time in Edm.DateTime format comes
            from when the job is moved out of the running state. Zero is a legal value
            if the job never stopped running or job never got into a running state.
          x-versionAdded: v1_1_0
        CompletionTime:
          description: This property represents completion time of Job.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of this property represents when the job was
            completed.
        Description:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Description
          nullable: true
          readOnly: true
        EndTime:
          description: This property represents End time of Job.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: This is the timestamp until when the service will wait
            for a job to complete. If a job did not complete within this time, it
            will be killed and marked as failed. TIME_NA is a default value that implies
            EndTime is not applicable. It is optional for clients to specify this
            property when creating a job.
        Id:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Id
          readOnly: true
        JobState:
          $ref: '#/components/schemas/DellJob_v1_8_0_JobState'
          description: The State of the Job.
          nullable: true
          readOnly: true
          x-longDescription: The value of the property specifies the State of the
            Job.
        JobType:
          $ref: '#/components/schemas/DellJob_v1_8_0_JobType'
          description: This property represent configuration type of job.
          nullable: true
          readOnly: true
          x-longDescription: The value of this property will be one of the possible
            configuration type of job.
        Message:
          description: The status Message for the Job.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of this property shall indicate the status
            message for the Job.
        MessageArgs:
          description: This array of message arguments are substituted for the arguments
            in the message.
          items:
            type: string
          type: array
          x-longDescription: This property shall contain the message substitution
            arguments for the specific message referenced by the MessageId and shall
            only be included if the MessageId is present.
        MessageId:
          description: The Message Id of the Job.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of this property the Message Id of the Job.
        Name:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Name
          readOnly: true
        PercentComplete:
          description: The percentage completion of the Job.
          format: int64
          maximum: 100
          minimum: 0
          readOnly: true
          type: integer
          x-longDescription: The value of this property shall indicate the percentage
            completion of the Job.
        RebootJobType:
          $ref: '#/components/schemas/DellJob_v1_8_0_RebootJobType'
          description: Type of host reboot.
          nullable: true
          readOnly: false
          x-longDescription: This property will help user to configure host reboot
            type.
          x-versionAdded: v1_0_2
        StartTime:
          description: This property represents scheduled start time of Job.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: This property will be defined as a String that will contain
            a timestamp in Edm.DateTime format. TIME_NOW is a default value that implies
            apply pending configuration now. This property will be required when creating
            a job with future timestamp.
        TargetSettingsURI:
          description: This property will be resource uri of settings object.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of this property will be the URI of a target
            resource on which the configuration is being applied. This property will
            be required when creating a job. This Property will be null on GET operation.
      required:
      - '@odata.id'
      - '@odata.type'
      - Id
      - Name
      type: object
      x-longDescription: This resource shall be used to represent a Job for a Redfish
        implementation.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
      x-requiredOnCreate:
      - TargetSettingsURI
    DellJob_v1_8_0_JobState:
      enum:
      - New
      - Scheduled
      - Running
      - Completed
      - Downloading
      - Downloaded
      - Scheduling
      - ReadyForExecution
      - Waiting
      - Paused
      - Failed
      - CompletedWithErrors
      - RebootPending
      - RebootFailed
      - RebootCompleted
      - PendingActivation
      - UserIntervention
      - Unknown
      type: string
      x-enumDescriptions:
        Completed: A job is in completed state
        CompletedWithErrors: A job is in completed state with errors
        Downloaded: A job is in downloaded state
        Downloading: A job is in downloading state
        Failed: A job is in failed state
        New: A job is in newly created state
        Paused: A job is in paused state
        PendingActivation: A job is in pending activation state
        ReadyForExecution: A job is in ready for execution state
        RebootCompleted: A job is in reboot completed state
        RebootFailed: A job is in reboot failed state
        RebootPending: A job is in pending state for reboot
        Running: A job is in running state
        Scheduled: A job is in scheduled state
        Scheduling: A job is in scheduling state
        Unknown: A job is in unknown state
        UserIntervention: Job is waiting for user intervention.
        Waiting: A job is in waiting state
      x-enumVersionAdded:
        UserIntervention: v1_3_0
    DellJob_v1_8_0_JobType:
      enum:
      - FirmwareUpdate
      - FirmwareRollback
      - RepositoryUpdate
      - RebootPowerCycle
      - RebootForce
      - RebootNoForce
      - Shutdown
      - RAIDConfiguration
      - BIOSConfiguration
      - NICConfiguration
      - FCConfiguration
      - iDRACConfiguration
      - SystemInfoConfiguration
      - InbandBIOSConfiguration
      - ExportConfiguration
      - ImportConfiguration
      - RemoteDiagnostics
      - RealTimeNoRebootConfiguration
      - LCLogExport
      - HardwareInventoryExport
      - FactoryConfigurationExport
      - LicenseImport
      - LicenseExport
      - ThermalHistoryExport
      - LCConfig
      - LCExport
      - PreviewConfiguration
      - SACollectHealthData
      - SAExportHealthData
      - SACollectExportHealthData
      - SAExposeISM
      - SARegistration
      - SystemErase
      - MessageRegistryExport
      - OSDeploy
      - Miscellaneous
      - SEKMRekey
      - SEKMStatusSet
      - DPUConfig
      - UploadCustomDefaults
      - ExportDeviceLog
      - SetBIOSTime
      - Unknown
      - AutoDiscoveryGenerateClientCertPrivateKey
      - AutoDiscoveryReplacePublicKey
      - BackupImage
      - DownloadServerPublicKey
      - ExportToolResults
      - InfiniBandConfiguration
      - LCDownloadClientCertificate
      - LCExportCertificate
      - LocalFileExport
      - RestoreImage
      - vFlashAttachPartition
      - vFlashCreatePartition
      - vFlashCreatePartitionUsingImage
      - vFlashDetachPartition
      - vFlashExportDataFromPartition
      - vFlashFormatPartition
      - vFlashInit
      - ForceGracefulShutdownJob
      type: string
      x-enumDescriptions:
        AutoDiscoveryGenerateClientCertPrivateKey: Job for generating Auto Discovery
          Client Cert Private Key
        AutoDiscoveryReplacePublicKey: Job for Replacing Auto Discovery Public Key
        BIOSConfiguration: A BIOS configuration job
        BackupImage: Image backup job
        DPUConfig: DPU Config job
        DownloadServerPublicKey: Job for downloading Server Public Key
        ExportConfiguration: A server configuration profile export job
        ExportDeviceLog: Export NVMe Device logs status job
        ExportToolResults: Export Tool result job
        FCConfiguration: A Fiber Channel configuration job
        FactoryConfigurationExport: A factory configuration export job
        FirmwareRollback: A firmware rollback job
        FirmwareUpdate: A firmware update job
        ForceGracefulShutdownJob: Force graceful shutdown job
        HardwareInventoryExport: A hardware inventory export job
        ImportConfiguration: A server configuration profile import job
        InbandBIOSConfiguration: An inband BIOS configuration job
        InfiniBandConfiguration: InfiniBand Configuration job
        LCConfig: A lifecycle controller attribute configuration job
        LCDownloadClientCertificate: LC Download Client Certificate job
        LCExport: A lifecycle controller export job
        LCExportCertificate: LC Certificate export job
        LCLogExport: A lifecycle controller log export job
        LicenseExport: A license export job
        LicenseImport: A license import job
        LocalFileExport: Local File export job
        MessageRegistryExport: Export message registry report job
        Miscellaneous: A Miscellaneous job.
        NICConfiguration: A NIC configuration job
        OSDeploy: Operating System deployment job
        PreviewConfiguration: Preview configuration job
        RAIDConfiguration: A RAID configuration job
        RealTimeNoRebootConfiguration: A real time configuration job without reboot
        RebootForce: A reboot job with forced shutdown
        RebootNoForce: A graceful reboot job without forced shutdown
        RebootPowerCycle: A power cycle job
        RemoteDiagnostics: A diagnostics collection job from iDRAC
        RepositoryUpdate: An update job from a repository
        RestoreImage: Restore image job
        SACollectExportHealthData: Support Assist collect and export health data job
        SACollectHealthData: Support Assist collect health data job
        SAExportHealthData: Support Assist export health data job
        SAExposeISM: Support Assist expose iSM installer package to host job
        SARegistration: Support Assist register iDRAC to Dell backend server job
        SEKMRekey: A Secure Enterprise Key Manager rekey job
        SEKMStatusSet: A Secure Enterprise Key Manager status set job
        SetBIOSTime: Schedules a configuration job to update the BIOS time.
        Shutdown: A shutdown job
        SystemErase: A selective system erase job
        SystemInfoConfiguration: A system info configuration job
        ThermalHistoryExport: A thermal history export job
        Unknown: An unknown job
        UploadCustomDefaults: Upload Custom Default iDRAC settings using Server Configuration
          Profile job
        iDRACConfiguration: An iDRAC configuration job
        vFlashAttachPartition: Attach vFlash partition job
        vFlashCreatePartition: Create vFlash partition job
        vFlashCreatePartitionUsingImage: Create vFlash partition using Image job
        vFlashDetachPartition: Detach vFlash Partition job
        vFlashExportDataFromPartition: Export vFlash data from Partition job
        vFlashFormatPartition: Format vFlash Partition job
        vFlashInit: vFlashInit job
      x-enumVersionAdded:
        AutoDiscoveryGenerateClientCertPrivateKey: v1_5_0
        AutoDiscoveryReplacePublicKey: v1_5_0
        BackupImage: v1_5_0
        DownloadServerPublicKey: v1_5_0
        ExportDeviceLog: v1_3_0
        ExportToolResults: v1_5_0
        ForceGracefulShutdownJob: v1_6_0
        InfiniBandConfiguration: v1_5_0
        LCDownloadClientCertificate: v1_5_0
        LCExportCertificate: v1_5_0
        LocalFileExport: v1_5_0
        Miscellaneous: v1_4_0
        PreviewConfiguration: v1_2_0
        RestoreImage: v1_5_0
        SetBIOSTime: v1_7_0
        UploadCustomDefaults: v1_3_0
        vFlashAttachPartition: v1_5_0
        vFlashCreatePartition: v1_5_0
        vFlashCreatePartitionUsingImage: v1_5_0
        vFlashDetachPartition: v1_5_0
        vFlashExportDataFromPartition: v1_5_0
        vFlashFormatPartition: v1_5_0
        vFlashInit: v1_5_0
    DellJob_v1_8_0_RebootJobType:
      enum:
      - PowerCycle
      - ForceReboot
      - NoForceReboot
      type: string
      x-enumDescriptions:
        ForceReboot: Reboot without graceful shutdown.
        NoForceReboot: Graceful shutdown.
        PowerCycle: Power cycle host server.
      x-enumLongDescriptions:
        ForceReboot: This value shall represent how host machine should restart.
        NoForceReboot: This value shall represent how host machine should restart.
        PowerCycle: This value shall represent how host machine should restart.
