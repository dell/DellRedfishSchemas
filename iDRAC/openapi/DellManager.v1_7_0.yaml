          readOnly: false
          x-longDescription: This property shall indicate the identity authentication
            option used by iDRAC for TLS based remote syslog. By default iDRAC will
            use anonymous idenity which can be overriden by generating a signed trust
            certificate to prove iDRAC's authenticity.
          x-versionAdded: v1_2_0
        SecurePort:
          description: Specifies the secure remote syslog port number.
          format: int64
          maximum: 65535
          minimum: 1
          readOnly: false
          type: integer
          x-longDescription: This property shall contain the secure remote syslog
            port number. The default port value is 6514. The port value should be
            an integral value from 1 to 65535.
          x-versionAdded: v1_2_0
        SecureServers:
          description: Name of the TLS supported remote syslog servers.
          items:
            type: string
          readOnly: false
          type: array
          x-longDescription: This property shall contain the list of all TLS supported
            remote syslog servers.
          x-versionAdded: v1_2_0
        SecureSysLogEnable:
          $ref: '#/components/schemas/DellManager_v1_7_0_SecureSysLogEnable'
          description: An indication of whether TLS based remote syslog is enabled.
          readOnly: false
          x-longDescription: This property shall indicate whether TLS based remote
            syslog is enabled or not. Enabled indicates TLS based remote syslog is
            enabled. Disabled indicates TLS based remote syslog is disabled. By default
            TLS support is disabled.
          x-versionAdded: v1_2_0
      type: object
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellManager_v1_7_0_IdentityProvenanceCertEntry:
