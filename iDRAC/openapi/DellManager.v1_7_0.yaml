      type: object
      x-longDescription: This action shall retrieve the identity provenance certificate
        chain from the easyrestore backend and return it as a PEM chain for motherboard/DC-SCM
        replacement tracking.
    DellManager_v1_7_0_GetIdentityProvenanceChainResponse:
      additionalProperties: false
      description: The response body for the GetIdentityProvenanceChain action.
      properties:
        IdentityProvenanceChain:
          description: Array of certificate entry objects representing the identity
            provenance chain.
          items:
            $ref: '#/components/schemas/DellManager_v1_7_0_IdentityProvenanceCertEntry'
          readOnly: true
          type: array
          x-longDescription: This property shall contain an array of certificate entry
            objects. Each entry contains an Id and CertificateString. Entries are
            ordered by pair index from CertChainRestore.json. For each pair, the SCV
            entry (if present) comes before the IDEVID entry.
          x-versionAdded: v1_7_0
      required:
      - IdentityProvenanceChain
      type: object
      x-longDescription: This type shall contain the properties found in the response
        body for the GetIdentityProvenanceChain action.
