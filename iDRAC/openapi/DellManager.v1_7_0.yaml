          nullable: true
          readOnly: false
          x-deprecatedReason: This property is deprecated in favour of DMTF standard
            USBPorts resource.
          x-longDescription: This property shall indicate the entity that currently
            controls the front USB ports of the system.
          x-versionAdded: v1_5_0
          x-versionDeprecated: v1_5_1
        Jobs:
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_idRef
