    DellManager_v1_7_0_DellManager:
      additionalProperties: false
      description: Oem data related to DellManager.
      properties:
        CustomDefaultsDownloadURI:
          description: The URI at which to download saved custom defaults. This URI
            shall return an HTTP 404, if the custom defaults have not been set already
            by using the SetCustomDefaults Oem Action.
          format: uri-reference
          readOnly: true
          type: string
          x-longDescription: This property shall contain the URI at which to download
            the saved custom defaults, using the Redfish protocol and authentication
            methods.  The service provides this URI for the download of the OEM-specific
            XML file of the saved custom defaults.  An HTTP GET from this URI shall
            return a response payload of MIME time `application/octet-stream`. This
            URI shall return an HTTP 404, if the custom defaults have not been set
            already by using the SetCustomDefaults Oem Action.
          x-versionAdded: v1_4_0
        DelliDRACCard:
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_idRef
          description: A resource representation of DelliDRACCard.
          readOnly: true
          x-autoExpand: true
          x-longDescription: A resource representation of DelliDRACCard.
          x-versionAdded: v1_2_0
        FSDStatus:
