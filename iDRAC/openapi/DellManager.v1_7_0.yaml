    DellManager_v1_7_0_ResetToDefaultsRequestBody:
      additionalProperties: false
      description: This action is used to reset the Dell attributes to default.
      properties:
        ResetType:
          $ref: '#/components/schemas/DellManager_v1_7_0_ResetType'
          description: The type of ResetType option to be performed.
          x-longDescription: The type of ResetType option to be performed.
      required:
      - ResetType
      type: object
      x-longDescription: This action shall perform reset of the Dell attributes to
        their default values.
    DellManager_v1_7_0_ResetType:
      enum:
      - All
      - ResetAllWithRootDefaults
      - Default
      - CustomDefaults
      type: string
      x-enumDescriptions:
        All: All configuration is set to default.
        CustomDefaults: All configuration is set to the custom defaults which would
          have been set previously using the SetCustomDefaults Action. In case there
          is no saved custom default settings available, this option will not work
        Default: All configuration is set to default except users and network settings
          are preserved.
        ResetAllWithRootDefaults: All configuration including network is set to default
          exception root user password set to calvin.
      x-enumVersionAdded:
        CustomDefaults: v1_4_0
    DellManager_v1_7_0_SecureClientAuth:
      enum:
