      - Certificate
      type: string
      x-enumDescriptions:
        Anonymous: TLS based remote syslog with anonymous client authentication.
        Certificate: TLS based remote syslog with certificate based client trust authentication
    DellManager_v1_7_0_SecureSysLogEnable:
      enum:
