          x-versionAdded: v1_7_0
        Id:
          description: Certificate identifier in format SCV_<index> or IDEVID_<index>.
          readOnly: true
          type: string
          x-longDescription: This property shall contain the certificate identifier
            in format SCV_<index> or IDEVID_<index> where index comes from the pair's
            index field in CertChainRestore.json.
          x-versionAdded: v1_7_0
      required:
