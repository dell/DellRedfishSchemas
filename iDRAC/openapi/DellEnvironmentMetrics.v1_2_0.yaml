    DellEnvironmentMetrics_v1_2_0_CMInputCurrentLimitType:
      additionalProperties: false
      properties:
        ChassisICLAmps:
          description: This property specifies the value in milliAmps (mA) to use
            in Set SPA calculations. Only valid if GridChassisICLEnabled Bit 0 is
            1.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property specifies the value in milliAmps (mA) to
            use in Set SPA calculations, with a default value of 0. It is only valid
            if the GridChassisICLEnabled Bit 0 is set to 1. This is a read-only property
            that can only be set by the Chassis Manager (CM) and applies to Lake Austin
            only.
          x-versionAdded: v1_2_0
        Enabled:
          description: Indicates whether the input current limit is enabled.
          readOnly: true
          type: boolean
          x-longDescription: This property specifies whether the input current limit
            functionality is enabled for the system. When set to true, the system
            will enforce the input current limit to ensure stability and prevent overcurrent
            conditions. This property is crucial for maintaining system integrity
            and preventing potential hardware damage.
          x-versionAdded: v1_2_0
        GridICLAmps:
          description: This property specifies the value in milliAmps (mA) to use
            in Set SPA calculations, with a default value of 0. It is only valid if
            the GridChassisICLEnabled Bit 0 is set to 1.
          format: int64
          nullable: true
          readOnly: true
