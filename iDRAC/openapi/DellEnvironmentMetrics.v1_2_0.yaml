      properties:
        BVMEnable:
          description: This property specifies the Bulk Voltage Modulation (BVM) setting
            for PSUs.
          readOnly: true
          type: boolean
          x-longDescription: This property specifies the Bulk Voltage Modulation (BVM)
            setting for Power Supply Units (PSUs). It can be set to 0 or 1, with a
            default value of 1. This property applies to Hubble and Lake Austin systems
            only.
          x-versionAdded: v1_2_0
        CableAmpLimit:
          description: This property enables the Power Adapter Cable Support.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property enables the Power Adapter Cable Support,
            such as for the C19-C14 cable. A value of 0 disables it, while a value
            greater than 0 enables it for the specified amp limit (e.g., 0Ch = 12
            Amps). The default value is 0. This value is read-only and set to 0Ch
            when a PSU with a specific part number is inserted.
          x-versionAdded: v1_2_0
      type: object
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
