components:
  schemas:
    DellPowerSupplyView_v1_4_0_DellPowerSupplyView:
      additionalProperties: false
      description: An instance of DellPowerSupplyView will have data specific to the
        Power Supply devices in the managed system.
      properties:
        '@odata.context':
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_context
        '@odata.etag':
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_etag
        '@odata.id':
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_id
        '@odata.type':
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_type
        Description:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Description
          nullable: true
          readOnly: true
        DetailedState:
          description: 'This property describes the further status of the power supply
            as enumerated for IPMI power supply sensor such as: Predictive Failure,
            Power Supply AC lost, AC lost or out-of-range,  AC out-of-range, but present.
            Note: DetailedState can be combination of above mentioned power supply
            status.'
          nullable: true
          readOnly: true
          type: string
          x-longDescription: 'This property describes the further status of the power
            supply as enumerated for IPMI power supply sensor such as: Predictive
            Failure, Power Supply AC lost, AC lost or out-of-range,  AC out-of-range,
            but present. Note: DetailedState can be combination of above mentioned
            power supply status.'
        DeviceDescription:
          description: A string that contains the friendly Fully Qualified Device
            Description (FQDD), which is a property that describes the device and
            its location.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: A string that contains the friendly Fully Qualified Device
            Description (FQDD), which is a property that describes the device and
            its location.
          x-versionAdded: v1_2_0
        Id:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Id
          readOnly: true
        LastSystemInventoryTime:
          description: This property indicates the time when Collection of System
            Inventory on Reboot (CSIOR) was last performed or the object was last
            updated on iDRAC. The value is represented in the format yyyymmddHHMMSS.
          format: date-time
          nullable: true
          readOnly: true
          type: string
          x-longDescription: This property indicates the time when Collection of System
            Inventory on Reboot (CSIOR) was last performed or the object was last
            updated on iDRAC. The value is represented in the format yyyymmddHHMMSS.
          x-versionAdded: v1_1_0
        LastUpdateTime:
          description: This property provides the time when the data was last updated.
            The value is represented as yyyymmddHHMMSS.
          format: date-time
          nullable: true
          readOnly: true
          type: string
          x-longDescription: This property provides the time when the data was last
            updated. The value is represented as yyyymmddHHMMSS.
          x-versionAdded: v1_1_0
        Name:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Name
          readOnly: true
        PMBusMonitoring:
          $ref: https://raw.githubusercontent.com/dell/DellRedfishSchemas/refs/heads/main/iDRAC/DellPowerSupplyView.yaml#/components/schemas/DellPowerSupplyView_PMBusMonitoring
          description: This property indicates whether the PowerSupply is capable
            of Power Monitoring.
          nullable: true
          readOnly: true
          x-longDescription: This property indicates whether the PowerSupply is capable
            of Power Monitoring.
          x-versionAdded: v1_1_0
        Range1MaxInputPowerWatts:
          description: Represents the Input rated power of the PowerSupply in Watts.
            0 denotes 'unknown'.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Represents the Input rated power of the PowerSupply in
            Watts. 0 denotes 'unknown'.
          x-units: Watts
        RedMinNumberNeeded:
          description: This property indicates the smallest number of elements that
            must be operational in order to function. For example, in an N+1 redundancy
            relationship, the RedMinNumberNeeded property is equal to N. In a 'LimitedSparing'
            environment, this property is not applicable and must be set to Zero.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property indicates the smallest number of elements
            that must be operational in order to function. For example, in an N+1
            redundancy relationship, the RedMinNumberNeeded property is equal to N.
            In a 'LimitedSparing' environment, this property is not applicable and
            must be set to Zero.
          x-versionAdded: v1_3_0
        RedTypeOfSet:
          description: RedTypeOfSet provides information on the type of redundancy.
            N+1 indicates all members are active, are unaware, and their functions
            do not dependent on each other. However, at least one extra member is
            present to achieve functionality. In this state, 'Sparing' is implied,
            and each member can be a spare for the other(s). An example of N+1 is
            a system that has 2 power supplies, but needs only 1 power supply to functioning
            properly. N+1 is a special case of N+M redundancy where M=1. A value of
            N+1 is used for N+M redundancy. Sparing indicates that all members are
            active and are aware of other members. However, their functionality is
            independent until failover. Each member can be a spare for the other(s).
            'InputPowerRedundancy' indicates that the power supply redundancy policy
            is set to 'Input Power Redundancy'.
          items:
            $ref: https://raw.githubusercontent.com/dell/DellRedfishSchemas/refs/heads/main/iDRAC/DellPowerSupplyView.yaml#/components/schemas/DellPowerSupplyView_RedTypeOfSet
            nullable: true
          readOnly: true
          type: array
          x-longDescription: RedTypeOfSet provides information on the type of redundancy.
            N+1 indicates all members are active, are unaware, and their functions
            do not dependent on each other. However, at least one extra member is
            present to achieve functionality. In this state, 'Sparing' is implied,
            and each member can be a spare for the other(s). An example of N+1 is
            a system that has 2 power supplies, but needs only 1 power supply to functioning
            properly. N+1 is a special case of N+M redundancy where M=1. A value of
            N+1 is used for N+M redundancy. Sparing indicates that all members are
            active and are aware of other members. However, their functionality is
            independent until failover. Each member can be a spare for the other(s).
            'InputPowerRedundancy' indicates that the power supply redundancy policy
            is set to 'Input Power Redundancy'.
          x-versionAdded: v1_3_0
        RedundancyStatus:
          $ref: https://raw.githubusercontent.com/dell/DellRedfishSchemas/refs/heads/main/iDRAC/DellPowerSupplyView.yaml#/components/schemas/DellPowerSupplyView_RedundancyStatus
          description: RedundancyStatus provides information about the state of the
            redundancy group. 'FullyRedundant' indicates that all the configured redundancy
            is still available. 'DegradedRedundancy' indicates that some configured
            elements are degraded, missing, or failed but that the number of elements
            in the set is still greater than the minimum required ('RedMinNumberNeeded').
            'RedundancyLost' indicates that sufficient configured elements are missing
            or have failed, and no redundancy is available. In this state, the next
            failure causes overall failure. 'OverallFailure' indicates that there
            is an overall failure of the redundancy set.
          nullable: true
          readOnly: true
          x-longDescription: RedundancyStatus provides information about the state
            of the redundancy group. 'FullyRedundant' indicates that all the configured
            redundancy is still available. 'DegradedRedundancy' indicates that some
            configured elements are degraded, missing, or failed but that the number
            of elements in the set is still greater than the minimum required ('RedMinNumberNeeded').
            'RedundancyLost' indicates that sufficient configured elements are missing
            or have failed, and no redundancy is available. In this state, the next
            failure causes overall failure. 'OverallFailure' indicates that there
            is an overall failure of the redundancy set.
          x-versionAdded: v1_3_0
      required:
      - '@odata.id'
      - '@odata.type'
      - Id
      - Name
      type: object
      x-longDescription: An instance of DellPowerSupplyView will have data specific
        to the Power Supply devices in the managed system.
