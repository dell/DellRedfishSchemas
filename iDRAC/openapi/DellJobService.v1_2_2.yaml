    DellJobService_v1_2_2_SetDeleteOnCompletionTimeout:
      additionalProperties: false
      description: This method sets the job store auto-delete policy. After successful
        execution, the jobs that have been completed longer than the duration specified
        in the DeleteOnCompletionTimeout parameter become eligible for deletion. Deletion
        occurs once the auto-delete threshold is reached, and it is triggered during
        the next job creation request. The auto-delete threshold is specified in the
        DellJobService.StartAutoDeleteAtThreshold property and represents the percentage
        of the maximum number of jobs allowed in the job store and has a default value
        of 50%.
      properties:
        target:
          description: Link to invoke action
          format: uri-reference
          type: string
      type: object
      x-longDescription: This method sets the job store auto-delete policy. After
