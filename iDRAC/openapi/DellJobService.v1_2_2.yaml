    DellJobService_v1_2_2_DeleteJobQueue:
      additionalProperties: false
      description: 'The DeleteJobQueue() method is used for deleting jobs from the
        JobQueue or the job store. To clear all the jobs, use the keyword JID_CLEARALL
        for the JobID. Successful execution of this method with the JID_CLEARALL parameter
        value also clears all the pending attribute values. When the number of jobs
        in the JobQueue reaches the maximum limit, jobs in the ""Completed"" state
        are deleted automatically. Note: on 11th Generation of PowerEdge systems,
        jobs in the ""Failed"" state are not deleted automatically and must be removed
        manually one at a time, or all together using the keyword JID_CLEARALL.'
      properties:
        target:
          description: Link to invoke action
          format: uri-reference
          type: string
      type: object
      x-longDescription: 'The DeleteJobQueue() method is used for deleting jobs from
        the JobQueue or the job store. To clear all the jobs, use the keyword JID_CLEARALL
        for the JobID. Successful execution of this method with the JID_CLEARALL parameter
        value also clears all the pending attribute values. When the number of jobs
        in the JobQueue reaches the maximum limit, jobs in the ""Completed"" state
        are deleted automatically. Note: on 11th Generation of PowerEdge systems,
        jobs in the ""Failed"" state are not deleted automatically and must be removed
        manually one at a time, or all together using the keyword JID_CLEARALL.'
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
