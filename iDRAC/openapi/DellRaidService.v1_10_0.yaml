    DellRaidService_v1_10_0_CheckVDValues:
      additionalProperties: false
      deprecated: true
      description: 'The CheckVDValues() method is used to determine the possible sizes
        of Virtual disks and the default settings, proviced a RAID level and set of
        physical disks. The VDPropArray property is filled with Size and other values,
