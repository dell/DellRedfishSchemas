    DellVirtualDisk_OperationalStates:
      enum:
      - BackgroundInitialization
      - CheckConsistency
      - Initialize
      - Reconstruct
      - Rebuild
      - Clear
      - Copyback
      - Learn
      - TTYExport
      type: string
      x-enumDescriptions:
        BackgroundInitialization: A background initialization operation is in progress.
        CheckConsistency: A check consistency operation is in progress.
        Clear: A data erase operation is in progress on a physical disk.
        Copyback: A copyback operation is in progress from a hot spare to a replacement
          physical disk.
        Initialize: An initialization operation is in progress.
        Learn: A battery reconditioning cycle is in progress.
        Rebuild: A rebuild operation is in progress on a failed disk.
        Reconstruct: A virtual disk reconstruction operation is in progress.
        TTYExport: A log export operation is in progress.
      x-enumLongDescriptions:
        BackgroundInitialization: A background initialization operation is in progress.
        CheckConsistency: A check consistency operation is in progress.
        Clear: A data erase operation is in progress on a physical disk.
        Copyback: A copyback operation is in progress from a hot spare to a replacement
          physical disk.
        Initialize: An initialization operation is in progress.
        Learn: A battery reconditioning cycle is in progress.
        Rebuild: A rebuild operation is in progress on a failed disk.
        Reconstruct: A virtual disk reconstruction operation is in progress.
        TTYExport: A log export operation is in progress.
