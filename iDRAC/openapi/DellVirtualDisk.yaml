    DellVirtualDisk_PendingConfigurationStatus:
      enum:
      - Current
      - Pending
      - CurrentPendingDelete
      - PendingCreate
      type: string
      x-enumDescriptions:
        Current: The virtual disk configuration is current with no pending changes.
        CurrentPendingDelete: The virtual disk is current but has a pending delete
          operation.
        Pending: Configuration changes are pending for the virtual disk.
        PendingCreate: The virtual disk has a pending create operation.
      x-enumLongDescriptions:
        Current: The virtual disk configuration is current with no pending changes.
        CurrentPendingDelete: The virtual disk is current but has a pending delete
          operation.
        Pending: Configuration changes are pending for the virtual disk.
        PendingCreate: The virtual disk has a pending create operation.
