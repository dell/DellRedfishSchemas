    DellVirtualDisk_AllowedOperations:
      additionalProperties: false
      description: The allowed operations for the virtual disk.
      properties: {}
      type: object
      x-longDescription: This type shall contain the allowed operations that can be
        performed on the virtual disk.
      x-patternProperties:
        '[A-Za-z0-9]+': {}
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellVirtualDisk_AvailableCachePolicies:
      enum:
      - WriteThrough
      - WriteBack
      - WriteBackForce
      - NoReadAhead
      - ReadAhead
      - AdaptiveReadAhead
      type: string
      x-enumDescriptions:
        AdaptiveReadAhead: The adaptive read ahead cache policy is available for the
          virtual disk.
        NoReadAhead: The no read ahead cache policy is available for the virtual disk.
        ReadAhead: The read ahead cache policy is available for the virtual disk.
        WriteBack: The write back cache policy is available for the virtual disk.
        WriteBackForce: The force write back cache policy is available for the virtual
          disk.
        WriteThrough: The write through cache policy is available for the virtual
          disk.
      x-enumLongDescriptions:
        AdaptiveReadAhead: The adaptive read ahead cache policy is available for the
          virtual disk.
        NoReadAhead: The no read ahead cache policy is available for the virtual disk.
        ReadAhead: The read ahead cache policy is available for the virtual disk.
        WriteBack: The write back cache policy is available for the virtual disk.
        WriteBackForce: The force write back cache policy is available for the virtual
          disk.
        WriteThrough: The write through cache policy is available for the virtual
          disk.
