    DellDrive_OperationalState:
      description: The operational state of the physical disk.
      enum:
      - BackgroundInitialization
      - CheckConsistency
      - Initialize
      - Reconstruct
      - Rebuild
      - Clear
      - Copyback
      - Learn
      - TTYExport
      type: string
      x-enumDescriptions:
        BackgroundInitialization: The physical disk is undergoing background initialization.
        CheckConsistency: The physical disk is undergoing a check consistency operation.
        Clear: The data on the physical disk is being erased.
        Copyback: The data is being copied back from a hot spare to a replacement
          physical disk.
        Initialize: The physical disk or logical disk is being initialized.
        Learn: The battery is undergoing a reconditioning cycle.
        Rebuild: The physical disk is being rebuilt after a failure.
        Reconstruct: The virtual disk associated with the physical disk is being reconstructed.
        TTYExport: The log is being exported from the TTY interface.
      x-longDescription: This type shall contain the operational state of the physical
        disk as reported by the RAID controller.
    DellDrive_PendingChange:
      description: The type of pending change for the physical disk.
      enum:
      - HotSpare
      - State
      - Operations
      - RebuildPhysicalDisk
      - CancelRebuildPhysicalDisk
      - SecureErase
      - SecureErasePSID
      - BlockErase
      type: string
      x-enumDescriptions:
        BlockErase: A block erase operation is pending.
        CancelRebuildPhysicalDisk: A cancel rebuild operation is pending.
        HotSpare: A hot spare assignment change is pending.
        Operations: An operations change is pending.
        RebuildPhysicalDisk: A rebuild operation is pending.
        SecureErase: A secure erase operation is pending.
        SecureErasePSID: A secure erase PSID operation is pending.
        State: A state change is pending.
      x-enumVersionAdded:
        BlockErase: v1_4_1
      x-longDescription: This type shall contain the types of pending changes for
        the physical disk configuration.
