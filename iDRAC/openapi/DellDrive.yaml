        ALTA: The drive is behind an ALTA bridge.
        BlinkUnblinkCapable: The drive supports blink and unblink operations.
        Certified: The drive is certified.
        DIF: The drive supports Data Integrity Field.
        EnhanceConfigLockdownCapable: The drive supports enhanced config lockdown.
        EnhanceUpdateLockdownCapable: The drive supports enhanced update lockdown.
        FDECapable: The drive is Full Disk Encryption capable.
        HDDFarmLogSupported: The HDD drive supports FARM log.
        NVMeBlockSanitize: The NVMe drive supports block sanitize.
        NVMeCryptoSanitize: The NVMe drive supports crypto sanitize.
        PDClearCapable: The drive supports PD clear operation.
        PDUnmapCapable: The drive supports PD unmap operation.
        PDUnmapCapableForVDConfig: The drive supports PD unmap for virtual disk configuration.
        PassthruAdvHostPD: The drive is an advanced passthrough host physical disk.
        PassthruEPD: The PERC drive is ePD-PT.
        PassthruHostPD: The drive is a passthrough host physical disk.
        PostProcessingFlag: The drive has a post processing flag set.
        PrepareToRemoveCapable: The drive supports prepare to remove operation.
        RTPartialInventory: Real-time partial drive inventory is supported.
        SEKMLocked: The drive is locked by Secure Enterprise Key Management (SEKM)
          key.
        SSD: The media type of the drive is Solid State.
        SecureEraseCapable: The drive is Secure Erase capable.
        SmartAlert: The drive has a SMART alert present.
        SupportPELCollection: The drive supports PEL collection.
        SupportTelemetryCollection: The drive supports telemetry collection.
        UnknownMediaType: The drive has an unknown media type.
        VOSS: The drive is a VOSS drive.
      x-longDescription: This type shall contain the storage capabilities supported
        by the physical disk.
