    DellDrive_StorageCapability:
      description: The storage capability of the physical disk.
      enum:
      - SmartAlert
      - SSD
      - FDECapable
      - SecureEraseCapable
      - DIF
      - ALTA
      - PDClearCapable
      - RTPartialInventory
      - PassthruEPD
      - SEKMLocked
      - EnhanceUpdateLockdownCapable
      - EnhanceConfigLockdownCapable
      - PDUnmapCapable
      - PDUnmapCapableForVDConfig
      - Certified
      - BlinkUnblinkCapable
      - PrepareToRemoveCapable
      - PassthruHostPD
      - PassthruAdvHostPD
