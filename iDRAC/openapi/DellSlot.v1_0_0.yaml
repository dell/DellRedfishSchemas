        ConnectorLayout:
          $ref: https://raw.githubusercontent.com/dell/DellRedfishSchemas/refs/heads/main/iDRAC/DellSlot.yaml#/components/schemas/DellSlot_ConnectorLayout
          description: Describes the type of packaging normally associated with this
            type of connector. 16 (PCI) - Describes the generic PCI connector layout.
            17 (PCI-X) - Describes the PCI Extended connector layout. 18 (PCI-E) -
            Describes the PCI Express connector layout, where the actual layout, as
            far as the length is concerned, is unknown. 19 - 25 (PCI-E xN) - Describes
            the PCI Express connector layout, where N is the lane count that appropriately
            describes the length of the PCI-E connector.
          nullable: true
          readOnly: true
          x-longDescription: Describes the type of packaging normally associated with
            this type of connector. 16 (PCI) - Describes the generic PCI connector
            layout. 17 (PCI-X) - Describes the PCI Extended connector layout. 18 (PCI-E)
            - Describes the PCI Express connector layout, where the actual layout,
            as far as the length is concerned, is unknown. 19 - 25 (PCI-E xN) - Describes
            the PCI Express connector layout, where N is the lane count that appropriately
            describes the length of the PCI-E connector.
        Description:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Description
          nullable: true
          readOnly: true
