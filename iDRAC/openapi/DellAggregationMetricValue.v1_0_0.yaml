        TimeStamp:
          description: 'TimeStamp identifies the time when the value of a metric instance
            is computed. This value is different from the time when the instance is
            created. For a CIM_BaseMetricValue instance, if Volatile is set to true,
            the TimeStamp changes when a new measurement snapshot is taken. A management
