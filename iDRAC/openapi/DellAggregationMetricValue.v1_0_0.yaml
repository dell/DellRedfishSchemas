        AggregationDuration:
          description: AggregationDuration represents the time duration over which
            the aggregation is computed. The start of a monitoring interval, over
            which the aggregation function is applied, is determined by subtracting
            the AggregationDuration from the AggregationTimestamp.
          nullable: true
          pattern: ^P(\d+D)?(T(\d+H)?(\d+M)?(\d+(.\d+)?S)?)?$
          readOnly: true
          type: string
          x-longDescription: AggregationDuration represents the time duration over
            which the aggregation is computed. The start of a monitoring interval,
            over which the aggregation function is applied, is determined by subtracting
            the AggregationDuration from the AggregationTimestamp.
        AggregationTimeStamp:
          description: AggregationTimeStamp identifies the time when the aggregation
            function was applied to determine the value of the metric instance. This
            value is different from the time when the instance is created. For a CIM_AggregationMetricValue
            instance, the AggregationTimeStamp changes whene the aggregation function
            is applied to calculate the value.
          format: date-time
          nullable: true
