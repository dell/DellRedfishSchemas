    OemComputerSystem_v1_2_0_SetWatchdog:
      additionalProperties: false
      description: This action is used to set the watchdog timeout interval.
      properties:
        target:
          description: Link to invoke action
          format: uri-reference
          type: string
        title:
          description: Friendly action name
          type: string
      type: object
      x-longDescription: This action shall set the watchdog timeout interval. The
        watchdog state will reset to its factory default setting of disabled upon
        reset to defaults.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
      x-versionAdded: v1_1_0
    OemComputerSystem_v1_2_0_SetWatchdogRequestBody:
      additionalProperties: false
      description: This action is used to set the watchdog timeout interval.
      properties:
        TimeoutInterval:
          description: The watchdog timeout interval to be set.
          format: int64
          maximum: 5
          minimum: 0
          type: integer
          x-longDescription: The watchdog timeout interval to be set in minutes with
            a supported range of 0 to 5. If the value is non-zero, the watchdog will
            be enabled with the specified timeout interval, if zero, it will be disabled.
      required:
      - TimeoutInterval
      type: object
      x-longDescription: This action shall set the watchdog timeout interval. The
        watchdog state will reset to its factory default setting of disabled upon
        reset to defaults.
    OemComputerSystem_v1_2_0_WatchdogState:
      enum:
      - Running
      - NotRunning
      type: string
      x-enumDescriptions:
        NotRunning: Watchdog is not running.
        Running: Watchdog is running.
    OemComputerSystem_v1_2_0_WatchdogTimeoutActions:
      enum:
      - None
      - ResetSystem
      - PowerCycle
      - PowerDown
      - OEM
      type: string
      x-enumDescriptions:
        None: No action taken.
        OEM: Perform an OEM-defined action.
        PowerCycle: Power cycle the system.
        PowerDown: Power down the system.
        ResetSystem: Reset the system.
