          x-units: Watts
        RedMinNumberNeeded:
          description: This property indicates the smallest number of elements that
            must be operational in order to function. For example, in an N+1 redundancy
            relationship, the RedMinNumberNeeded property is equal to N. In a 'LimitedSparing'
            environment, this property is not applicable and must be set to Zero.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: This property indicates the smallest number of elements
            that must be operational in order to function. For example, in an N+1
            redundancy relationship, the RedMinNumberNeeded property is equal to N.
            In a 'LimitedSparing' environment, this property is not applicable and
            must be set to Zero.
        RedTypeOfSet:
          description: RedTypeOfSet provides information on the type of redundancy.
            N+1 indicates all members are active, are unaware, and their functions
            do not dependent on each other. However, at least one extra member is
            present to achieve functionality. In this state, 'Sparing' is implied,
            and each member can be a spare for the other(s). An example of N+1 is
            a system that has 2 power supplies, but needs only 1 power supply to functioning
            properly. N+1 is a special case of N+M redundancy where M=1. A value of
            N+1 is used for N+M redundancy. Sparing indicates that all members are
            active and are aware of other members. However, their functionality is
            independent until failover. Each member can be a spare for the other(s).
            'InputPowerRedundancy' indicates that the power supply redundancy policy
            is set to 'Input Power Redundancy'.
          items:
            $ref: https://raw.githubusercontent.com/dell/DellRedfishSchemas/refs/heads/main/iDRAC/DellPowerSupplyView.yaml#/components/schemas/DellPowerSupplyView_RedTypeOfSet
            nullable: true
          readOnly: true
          type: array
          x-longDescription: RedTypeOfSet provides information on the type of redundancy.
            N+1 indicates all members are active, are unaware, and their functions
            do not dependent on each other. However, at least one extra member is
            present to achieve functionality. In this state, 'Sparing' is implied,
            and each member can be a spare for the other(s). An example of N+1 is
            a system that has 2 power supplies, but needs only 1 power supply to functioning
            properly. N+1 is a special case of N+M redundancy where M=1. A value of
            N+1 is used for N+M redundancy. Sparing indicates that all members are
            active and are aware of other members. However, their functionality is
            independent until failover. Each member can be a spare for the other(s).
            'InputPowerRedundancy' indicates that the power supply redundancy policy
            is set to 'Input Power Redundancy'.
        RedundancyStatus:
          $ref: https://raw.githubusercontent.com/dell/DellRedfishSchemas/refs/heads/main/iDRAC/DellPowerSupplyView.yaml#/components/schemas/DellPowerSupplyView_RedundancyStatus
          description: RedundancyStatus provides information about the state of the
            redundancy group. 'FullyRedundant' indicates that all the configured redundancy
            is still available. 'DegradedRedundancy' indicates that some configured
            elements are degraded, missing, or failed but that the number of elements
            in the set is still greater than the minimum required ('RedMinNumberNeeded').
            'RedundancyLost' indicates that sufficient configured elements are missing
            or have failed, and no redundancy is available. In this state, the next
            failure causes overall failure. 'OverallFailure' indicates that there
            is an overall failure of the redundancy set.
          nullable: true
          readOnly: true
          x-longDescription: RedundancyStatus provides information about the state
            of the redundancy group. 'FullyRedundant' indicates that all the configured
            redundancy is still available. 'DegradedRedundancy' indicates that some
            configured elements are degraded, missing, or failed but that the number
            of elements in the set is still greater than the minimum required ('RedMinNumberNeeded').
            'RedundancyLost' indicates that sufficient configured elements are missing
            or have failed, and no redundancy is available. In this state, the next
            failure causes overall failure. 'OverallFailure' indicates that there
            is an overall failure of the redundancy set.
