            of Power Monitoring.
          nullable: true
          readOnly: true
          x-longDescription: This property indicates whether the PowerSupply is capable
            of Power Monitoring.
        Range1MaxInputPowerWatts:
          description: Represents the Input rated power of the PowerSupply in Watts.
