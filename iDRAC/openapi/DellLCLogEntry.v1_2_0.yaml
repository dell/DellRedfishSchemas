components:
  schemas:
    DellLCLogEntry_v1_2_0_Category:
      enum:
      - Storage
      - Updates
      - Audit
      - Configuration
      - WorkNotes
      - SystemHealth
      type: string
      x-enumDescriptions:
        Audit: The Event has been generated as part of Audit type
        Configuration: The Event has been generated as part of Configuration type
        Storage: The Event has been generated as part of Storage unit
        SystemHealth: The Event has been generated as part of System Health unit
        Updates: The Event has been generated as part of Updates
        WorkNotes: The Event has been generated as part of Work Notes
    DellLCLogEntry_v1_2_0_DellLCLogEntry:
      additionalProperties: false
      description: This is for the additional OEM properties to complement DMTF LogEntry
        Schema for Lifecycle Logs.
      properties:
        AgentID:
          description: Property to represent agentID of event that has occurred.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of the property specifies the agentID of event.
          x-versionAdded: v1_2_0
        BitMask:
          description: Property to represent action filter bit mask of event that
            has occurred.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of the property specifies the action filter
            bit mask of event.
          x-versionAdded: v1_2_0
        Category:
          $ref: '#/components/schemas/DellLCLogEntry_v1_2_0_Category'
          description: Property to represent category of Event that has occurred.
          nullable: true
          readOnly: true
          x-longDescription: The value of the property specifies the category of Event.
        Comment:
          description: Property to display any comment that might have been added
            to the log entry.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: Property to display any comment that might have been
            added to the log entry.
        LastUpdatedByUser:
          description: Property to display UserName of the user that last commented
            on the log entry.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: Property to display UserName of the user that last commented
            on the log entry.
        PreviousSequenceOfLogs:
          description: Property to display previous sequence of log entries.
          items:
            $ref: '#/components/schemas/DellLCLogEntry_v1_2_0_PreviousSequenceOfLogsInfo'
            nullable: true
          readOnly: true
          type: array
          x-longDescription: Property to display previous sequence of log entries.
          x-versionAdded: v1_1_0
      type: object
      x-longDescription: This is for the additional OEM properties to complement DMTF
        LogEntry Schema for Lifecycle Logs.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellLCLogEntry_v1_2_0_PreviousSequenceOfLogsInfo:
      additionalProperties: false
      properties:
        Created:
          description: The date and time when the log entry was created.
          format: date-time
          readOnly: true
          type: string
          x-longDescription: This property shall contain the date and time when the
            log entry was created.
          x-versionAdded: v1_1_0
        Message:
          description: The message of the log entry.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: This property shall contain the message of the log entry.
          x-versionAdded: v1_1_0
        MessageId:
          description: The MessageId of the log.
          readOnly: true
          type: string
          x-longDescription: The MessageId of the log.
          x-versionAdded: v1_1_0
      type: object
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
title: '#DellLCLogEntry.v1_2_0'
