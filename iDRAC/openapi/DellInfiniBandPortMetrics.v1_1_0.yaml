          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of RDMA bytes transmitted.
        RDMATxTotalPackets:
          description: Indicates the total number of RDMA packets transmitted.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of RDMA packets transmitted.
        RDMATxTotalReadReqPkts:
          description: Indicates the total number of RDMA ReadRequest packets transmitted.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of RDMA ReadRequest packets
            transmitted.
        RDMATxTotalSendPkts:
          description: Indicates the total number of RDMA Send packets transmitted.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of RDMA Send packets transmitted.
        RDMATxTotalWritePkts:
          description: Indicates the total number of RDMA Write packets transmitted.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of RDMA Write packets transmitted.
        RxBroadcast:
          description: Indicates the total number of good broadcast packets received.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of good broadcast packets
            received.
        RxBytes:
          description: Indicates the total number of bytes received, including host
            and remote management pass through traffic. Remote management passthrough
            traffic is applicable to LOMs only.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of bytes received, including
            host and remote management pass through traffic. Remote management passthrough
            traffic is applicable to LOMs only.
          x-units: Bytes
        RxErrorPktAlignmentErrors:
          description: Indicates the total number of packets received with alignment
            errors.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of packets received with alignment
            errors.
        RxErrorPktFCSErrors:
          description: Indicates the total number of packets received with FCS errors.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of packets received with FCS
            errors.
        RxFalseCarrierDetection:
          description: Indicates the total number of false carrier errors received
            from PHY.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of false carrier errors received
            from PHY.
        RxJabberPkt:
          description: Indicates the total number of frames that are too long.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of frames that are too long.
        RxMulticastPackets:
          description: Counts the total number of good multicast packets received.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Counts the total number of good multicast packets received.
          x-units: Packets
          x-versionAdded: v1_1_0
        RxMutlicastPackets:
          deprecated: true
          description: Indicates the total number of good multicast packets transmitted.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-deprecatedReason: This property has been deprecated in favor of RxMulticastPackets.
          x-longDescription: Indicates the total number of good multicast packets
            transmitted.
          x-units: Packets
          x-versionDeprecated: v1_1_0
        RxPauseXOFFFrames:
          description: Indicates the flow control frames from the network to pause
            transmission.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the flow control frames from the network to
            pause transmission.
        RxPauseXONFrames:
          description: Indicates the flow control frames from the network to resume
            transmission.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the flow control frames from the network to
            resume transmission.
        RxRuntPkt:
          description: Indicates the total number of frames that are too short (<
            64 bytes).
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of frames that are too short
            (< 64 bytes).
        RxUnicastPackets:
          description: Indicates the total number of good unicast packets transmitted.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of good unicast packets transmitted.
          x-units: Packets
        StartStatisticTime:
          description: Indicates the measurement time for the first InfiniBand statistics.
            The property is used with the StatisticTime property to calculate the
            duration over which the InfiniBand statistics are gathered.
          format: date-time
          nullable: true
          readOnly: true
          type: string
          x-longDescription: Indicates the measurement time for the first InfiniBand
            statistics. The property is used with the StatisticTime property to calculate
            the duration over which the InfiniBand statistics are gathered.
        StatisticTime:
          description: Indicates the most recent measurement time for InfiniBand statistics.
            The property is used with the StatisticStartTime property to calculate
            the duration over which the InfiniBand statistics are gathered.
          format: date-time
          nullable: true
          readOnly: true
          type: string
          x-longDescription: Indicates the most recent measurement time for InfiniBand
            statistics. The property is used with the StatisticStartTime property
            to calculate the duration over which the InfiniBand statistics are gathered.
        TotalExcessiveBufferOverrun:
          description: The number of times that Overrun Errors consecutive flow control
            update periods occurred, each having at least one overrun error.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: The number of times that Overrun Errors consecutive flow
            control update periods occurred, each having at least one overrun error.
        TotalLinkDownedCounter:
          description: Total number of times the Port Training state machine has failed
            the link error recovery process and downed the link.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Total number of times the Port Training state machine
            has failed the link error recovery process and downed the link.
        TotalLinkErrorRecoveryCounter:
          description: Total number of times the Port Training state machine has successfully
            completed the link error recovery process.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Total number of times the Port Training state machine
            has successfully completed the link error recovery process.
        TotalLocalLinkIntegrityErrors:
          description: The number of times that the count of local physical errors
            exceeded the threshold specified by Local Phy Errors.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: The number of times that the count of local physical
            errors exceeded the threshold specified by Local Phy Errors.
        TotalPortReceiveData:
          description: Total number of data octets, divided by 4 (lanes), received
            on all VLs.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Total number of data octets, divided by 4 (lanes), received
            on all VLs.
        TotalPortReceiveErrors:
          description: Total number of packets containing an error that were received
            on the port.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Total number of packets containing an error that were
            received on the port.
        TotalPortReceivePackets:
          description: Total number of packets , this may include packets containing
            Errors.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Total number of packets , this may include packets containing
            Errors.
        TotalPortReceiveRemotePhysicalErrors:
          description: Total number of packets marked with the EBP delimiter received
            on the port.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Total number of packets marked with the EBP delimiter
            received on the port.
        TotalPortTransmitData:
          description: Total number of data octets, divided by 4 (lanes), transmitted
            on all VLs.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Total number of data octets, divided by 4 (lanes), transmitted
            on all VLs.
        TotalPortTransmitDiscard:
          description: Total number of outbound packets discarded by the port because
            the port is down or congested.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Total number of outbound packets discarded by the port
            because the port is down or congested.
        TotalPortTransmitPackets:
          description: Total number of packets transmitted on all VLs from this port.
            This may include packets with errors.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Total number of packets transmitted on all VLs from this
            port. This may include packets with errors.
        TotalPortTransmitWait:
          description: The number of ticks during which the port had data to transmit
            but no data was sent during the entire tick (either because of insufficient
            credits or because of lack of arbitration).
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: The number of ticks during which the port had data to
            transmit but no data was sent during the entire tick (either because of
            insufficient credits or because of lack of arbitration).
        TotalSymbolErrorCounter:
          description: Total number of minor link errors detected on one or more physical
            lanes.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Total number of minor link errors detected on one or
            more physical lanes.
        TotalVL15Dropped:
          description: Number of incoming VL15 packets dropped due to resource limitations
            (e.g., lack of buffers) of the port.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Number of incoming VL15 packets dropped due to resource
            limitations (e.g., lack of buffers) of the port.
        TxBroadcast:
          description: Indicates the total number of good broadcast packets transmitted.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of good broadcast packets
            transmitted.
        TxBytes:
          description: Indicates the total number of bytes transmitted, including
            host and remote management passthrough traffic. Remote management passthrough
            traffic is applicable to LOMs only.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of bytes transmitted, including
            host and remote management passthrough traffic. Remote management passthrough
            traffic is applicable to LOMs only.
          x-units: Bytes
        TxErrorPktExcessiveCollision:
          description: Indicates the number of times a single transmitted packet encountered
            more than 15 collisions.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the number of times a single transmitted packet
            encountered more than 15 collisions.
        TxErrorPktLateCollision:
          description: Indicates the number of collisions that occurred after one
            slot time (defined by IEEE 802.3).
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the number of collisions that occurred after
            one slot time (defined by IEEE 802.3).
        TxErrorPktMultipleCollision:
          description: Indicates the number of times that a transmitted packet encountered
            2-15 collisions.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the number of times that a transmitted packet
            encountered 2-15 collisions.
        TxErrorPktSingleCollision:
          description: Indicates the number of times that a successfully transmitted
            packet encountered a single collision.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the number of times that a successfully transmitted
            packet encountered a single collision.
        TxMulticastPackets:
          description: Counts the total number of good multicast packets transmitted.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Counts the total number of good multicast packets transmitted.
          x-units: Packets
          x-versionAdded: v1_1_0
        TxMutlicastPackets:
          deprecated: true
          description: Indicates the total number of good multicast packets transmitted.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-deprecatedReason: This property has been deprecated in favor of TxMulticastPackets.
          x-longDescription: Indicates the total number of good multicast packets
            transmitted.
          x-units: Packets
          x-versionDeprecated: v1_1_0
        TxPauseXOFFFrames:
          description: Indicates the number of XOFF packets transmitted to the network.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the number of XOFF packets transmitted to the
            network.
        TxPauseXONFrames:
          description: Indicates the number of XON packets transmitted to the network.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the number of XON packets transmitted to the
            network.
        TxUnicastPackets:
          description: Indicates the total number of good unicast packets transmitted.
          format: int64
          nullable: true
          readOnly: true
          type: integer
          x-longDescription: Indicates the total number of good unicast packets transmitted.
          x-units: Packets
