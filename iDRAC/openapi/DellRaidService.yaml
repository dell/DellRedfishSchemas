components:
  schemas:
    DellRaidService_ApplyTime:
      enum:
      - Staged
      - Immediate
      - OnReset
      type: string
      x-enumDescriptions:
        Immediate: Real-time job - applies changes immediately without reboot
        OnReset: Staged job without automatic reboot
        Staged: Staged job - requires system reboot to apply changes
      x-enumLongDescriptions:
        Immediate: Configuration changes are applied immediately in real-time without
          requiring a system reboot.
        OnReset: Configuration changes are staged but will not trigger an automatic
          reboot. Changes will be applied on the next manual system reset.
        Staged: Configuration changes are staged and will be applied on the next system
          reboot.
      x-enumVersionAdded:
        Immediate: v1_10_0
        OnReset: v1_10_0
        Staged: v1_10_0
    DellRaidService_BlockSizeInBytes:
      enum:
      - '4096'
      - '512'
      - All
      type: string
      x-enumDescriptions:
        '4096': Include 4096 bytes block size disks
        '512': Include 512 bytes block size disks only
        All: Include all block size disks
