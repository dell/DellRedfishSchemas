          description: 'The SimpleFunction property identifies the basic computation
            that is performed on an underlying metric for arriving at the value of
            this derived metric. This property is NULL when the ChangeType property
            has a value other than 5 "Simple Function". 2="Minimum": The metric reports
            the lowest value detected for the monitored entity. This is also known
