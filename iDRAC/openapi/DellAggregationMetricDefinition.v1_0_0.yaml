          description: 'GatheringType indicates how the metric values are gathered
            by the underlying instrumentation. This allows the client application
            to choose the right metric for the purpose. 0="Unknown": The GatheringType
            is not known. 2="OnChange": The CIM metric values get updated immediately
            when the values inside the measured resource change. The values of OnChange
            metrics truly reflect the current state within the resource. An example
            is the number of users logged on, which gets updated immediately as users
            log-on or log-off. 3="Periodic": The CIM metric values get updated periodically.
            For example, to a client application, a metric value that applies to the
            current time appears constant during each gathering interval and changes
            to the new value at the end of each gathering interval. 4="OnRequest":
            The CIM metric value is updated when a client application reads it. The
            values of OnRequest metrics return the current state within the resource
            when requested. However, the values do not change "unobserved" and therefore
            it is recommended that you do not subscribe for value changes of OnRequest
            metrics.'
