components:
  schemas:
    DellMetricReportValue_v1_0_1_DellMetricReportValue:
      additionalProperties: false
      description: The DellMetricReport schema describes Dell metric metadata collected
        and reported by the Redfish Service.
      properties:
        ContextID:
          description: The Context Id is a user friendly way to read the metric source.
          nullable: true
          type: string
          x-longDescription: The value of this property is a Context Id of the metric
            source.
        FQDD:
          description: The iDRAC standard FQDD of the device producing the metric.
          nullable: true
          type: string
          x-longDescription: The value of this property is the iDRAC standard FQDD
            of the device producing the metric.
        Label:
          description: The Label is a user friendly representation of the metric.
          nullable: true
          type: string
          x-longDescription: The value of this property is a friendly representation
            of the device description associated with the Metric Id.
        Source:
          description: This field shows the data source name that the metric value
            was obtained from.
          nullable: true
          type: string
          x-longDescription: The value of this property shows the data source name
            that the metric value was obtained from.
      type: object
      x-longDescription: The schema describes property additions to the Metrics within
        the MetricReport.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
