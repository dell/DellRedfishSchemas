components:
  schemas:
    DellOemStorageController_BatteryLearnMode:
      enum:
      - Automatic
      - WarnOnly
      - Disabled
      type: string
      x-enumDescriptions:
        Automatic: The RAID Adapter will perform a Battery Learn Cycle as needed.
        Disabled: The RAID Adapter will take no action when a Battery Learn Cycle
          is needed.
        WarnOnly: The RAID Adapter will issue a warning when a Battery Learn Cycle
          is needed, otherwise no action.
      x-enumLongDescriptions:
        Automatic: The RAID Adapter will perform a Battery Learn Cycle as needed.
        Disabled: The RAID Adapter will take no action when a Battery Learn Cycle
          is needed.
        WarnOnly: The RAID Adapter will issue a warning when a Battery Learn Cycle
          is needed, otherwise no action.
    DellOemStorageController_CheckConsistencyMode:
      enum:
      - Normal
      - StopOnError
      type: string
      x-enumDescriptions:
        Normal: The RAID Adapter supports normal Check Consistency operation.
        StopOnError: The RAID Adapter supports Check Consistency in which the operation
          will stop on an error.
      x-enumLongDescriptions:
        Normal: The RAID Adapter supports normal Check Consistency operation.
        StopOnError: The RAID Adapter supports Check Consistency in which the operation
          will stop on an error.
    DellOemStorageController_ControllerBootMode:
      enum:
      - UserMode
      - ContinueBootOnError
      - HeadlessModeContinueOnError
      - HeadlessSafeMode
      - SafeModeOnError
      type: string
      x-enumDescriptions:
        ContinueBootOnError: Boot Mode is Continue Boot On Error.
        HeadlessModeContinueOnError: Boot Mode is Headless.
        HeadlessSafeMode: Boot Mode is Headless Safe.
        SafeModeOnError: Boot Mode is Safe Mode On Error.
        UserMode: Boot Mode is User.
      x-enumLongDescriptions:
        ContinueBootOnError: Boot Mode is Continue Boot On Error.
        HeadlessModeContinueOnError: Boot Mode is Headless.
        HeadlessSafeMode: Boot Mode is Headless Safe.
        SafeModeOnError: Boot Mode is Safe Mode On Error.
        UserMode: Boot Mode is User.
