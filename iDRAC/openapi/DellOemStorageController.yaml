    DellOemStorageController_PersonalityMode:
      enum:
      - None
      - RAID
      - HBA
      - EnhancedHBA
      - Valid
      type: string
      x-enumDescriptions:
        EnhancedHBA: Enhanced Host Bus Adapter personality mode.
        HBA: Host Bus Adapter personality mode.
        None: No personality mode configured.
        RAID: RAID personality mode.
        Valid: Valid personality mode flag.
      x-enumLongDescriptions:
        EnhancedHBA: The storage controller is configured in Enhanced HBA mode, providing
          advanced HBA capabilities with additional features beyond standard HBA functionality.
        HBA: The storage controller is configured in HBA mode, acting as a simple
          host bus adapter without RAID capabilities.
        None: Indicates that no specific personality mode is configured for the storage
          controller.
        RAID: The storage controller is configured in RAID mode, providing RAID functionality
          for attached storage devices.
        Valid: Indicates that the personality mode configuration is valid and properly
          set.
