        HBA: Controller mode is HBA.
        None: Controller mode is None.
        RAID: Controller mode is RAID.
      x-enumLongDescriptions:
        EnhancedHBA: Controller mode is EnhancedHBA.
        HBA: Controller mode is HBA.
        None: Controller mode is None.
        RAID: Controller mode is RAID.
    DellOemStorageController_CopybackMode:
      enum:
      - 'Off'
      - 'On'
      - OnWithSMART
      type: string
      x-enumDescriptions:
        'Off': The Copy Back function is turned off in the RAID Adapter.
        'On': The RAID Adapter will perform a Copy Back after driver replacement.
        OnWithSMART: The RAID Adapter will perform a Copy Back to a hotspare when
          a SMART alert is detected.
      x-enumLongDescriptions:
        'Off': The Copy Back function is turned off in the RAID Adapter.
        'On': The RAID Adapter will perform a Copy Back after driver replacement.
        OnWithSMART: The RAID Adapter will perform a Copy Back to a hotspare when
          a SMART alert is detected.
