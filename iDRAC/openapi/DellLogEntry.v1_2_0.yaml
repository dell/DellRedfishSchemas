components:
  schemas:
    DellLogEntry_v1_2_0_Category:
      enum:
      - SystemHealth
      - Storage
      - Updates
      - Audit
      - Configuration
      - WorkNotes
      type: string
      x-enumDescriptions:
        Audit: The Event has been generated as part of Audit type
        Configuration: The Event has been generated as part of Configuration type
        Storage: The Event has been generated as part of Storage unit
        SystemHealth: The Event has been generated as part of System Health unit
        Updates: The Event has been generated as part of Updates
        WorkNotes: The Event has been generated as part of Work Notes
    DellLogEntry_v1_2_0_DellLogEntry:
      additionalProperties: true
      description: This is the schema definition for the additional OEM properties
        to complement DMTF LogEntry Schema.
      properties:
        AgentID:
          description: Property to represent agentID of event that has occurred.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of the property specifies the agentID of event.
          x-versionAdded: v1_2_0
        BitMask:
          description: Property to represent action filter bit mask of event that
            has occurred.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of the property specifies the action filter
            bit mask of event.
          x-versionAdded: v1_2_0
        Category:
          $ref: '#/components/schemas/DellLogEntry_v1_2_0_Category'
          description: Property to represent category of Event that has occurred.
          nullable: true
          readOnly: true
          x-longDescription: The value of the property specifies the category of Event.
          x-versionAdded: v1_2_0
        Comment:
          description: Property to display any comment that might have been added
            to the log entry.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: Property to display any comment that might have been
            added to the log entry.
          x-versionAdded: v1_2_0
        FQDD:
          description: Property to represent Fully Qualified Device Descriptor of
            an instance.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of the property represents Fully Qualified
            Device Descriptor of an instance.
          x-versionAdded: v1_0_1
        Id:
          description: Property represents the Id of an instance.
          nullable: true
          readOnly: true
          type: string
          x-versionAdded: v1_1_0
        LastUpdatedByUser:
          description: Property to display UserName of the user that last commented
            on the log entry.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: Property to display UserName of the user that last commented
            on the log entry.
          x-versionAdded: v1_2_0
        Name:
          description: Property represents the Name of an instance.
          nullable: true
          readOnly: true
          type: string
          x-versionAdded: v1_1_0
        SubSystem:
          description: Property to represent SubSystem of the FQDD.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of the property specifies the SubSystem of
            FQDD.
          x-versionAdded: v1_0_1
      type: object
      x-longDescription: This resource shall be used to represent an OEM LogEntry
        for a Redfish implementation.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellLogEntry_v1_2_0_DellLogEntrySummary:
      additionalProperties: false
      properties:
        Category:
          $ref: '#/components/schemas/DellLogEntry_v1_2_0_Category'
          description: Property to represent type of Event has Occurred.
          nullable: true
          readOnly: true
          x-longDescription: The value of the property specifies the type of Event.
        FQDD:
          description: Property to represent Fully Qualified Device Descriptor at
            an instance.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of the property represents Fully Qualified
            Device Descriptor of the instance.
        SubSystem:
          description: Property to represent SubSystem of the FQDD.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: The value of the property specifies the SubSystem of
            FQDD.
      type: object
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
title: '#DellLogEntry.v1_2_0'
