          readOnly: true
          type: string
          x-longDescription: The value of this property shall be a string that represents
            the publisher of this registry.
        RegistryEntries:
          $ref: '#/components/schemas/DellBootSourcesRegistry_v1_2_0_RegistryEntries'
          description: List of all attributes and their metadata for this component.
          x-longDescription: The value of this property shall a list of all attributes
            for this component, along with their possible values, dependencies, and
            other metadata.
        RegistryVersion:
          description: This is the BootSources registry version which is used in the
            middle portion of a BootSourcesRegistry.
          readOnly: true
          type: string
          x-longDescription: The value of this property shall be the version of this
            BootSources registry. The format of this string shall be of the format
            majorversion.minorversion.errata in compliance with Protocol Version section
            of the Redfish specification.
      required:
      - Language
      - RegistryVersion
      - OwningEntity
      - '@odata.id'
      - '@odata.type'
      - Id
      - Name
      type: object
      x-longDescription: This resource shall be used to represent an BootSources registry
        for a Redfish implementation.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    DellBootSourcesRegistry_v1_2_0_Dependencies:
      additionalProperties: false
