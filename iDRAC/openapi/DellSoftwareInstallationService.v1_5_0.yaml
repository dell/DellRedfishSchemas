    DellSoftwareInstallationService_v1_5_0_InstallFromRepository:
      additionalProperties: false
      description: This method creates the list of the updates contained in the repository
        that are supported by LC and are applicable to the system and installed hardware.
        The successful execution of this method creates a job. The list is copied
        to a persistent location so that you can query for the updatable list by using
        GetRepoBasedUpdateList WSMan Command. If ApplyUpdate is True, the applicable
        packages are staged. If ApplyUpdate is False, no updates are applied. If ApplyUpdate
        is Selected, only the components identified by ComponentIds are applied.
      properties:
        target:
          description: Link to invoke action
          format: uri-reference
          type: string
      type: object
      x-longDescription: This method creates the list of the updates contained in
        the repository that are supported by LC and are applicable to the system and
        installed hardware. The successful execution of this method creates a job.
        The list is copied to a persistent location so that you can query for the
        updatable list by using GetRepoBasedUpdateList WSMan Command. If ApplyUpdate
        is True, the applicable packages are staged. If ApplyUpdate is False, no updates
        are applied. If ApplyUpdate is Selected, only the components identified by
        ComponentIds are applied.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
