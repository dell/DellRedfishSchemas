        SampleInterval:
          description: SampleInterval provides the sample interval so that client
            applications can determine the minimum time interval to retrieve new statistics.
            The property value is in W3C representation in WS-CIM with the corresponding
            value equal to CIM datetime.
          nullable: true
          pattern: ^P(\d+D)?(T(\d+H)?(\d+M)?(\d+(.\d+)?S)?)?$
          readOnly: true
          type: string
          x-longDescription: SampleInterval provides the sample interval so that client
            applications can determine the minimum time interval to retrieve new statistics.
            The property value is in W3C representation in WS-CIM with the corresponding
            value equal to CIM datetime.
        TimeScope:
          $ref: https://raw.githubusercontent.com/dell/DellRedfishSchemas/refs/heads/main/iDRAC/DellBaseMetricDefinition.yaml#/components/schemas/DellBaseMetricDefinition_TimeScope
          description: 'TimeScope indicates the time scope to which the metric value
            applies. 0="Unknown": The time scope is not qualified by the metric designer
            or is unknown to the provider. 2="Point": The metric applies to a point
            in time. On the corresponding BaseMetricValue instances, TimeStamp specifies
            the point in time and Duration is always 0. 3="Interval": The metric applies
            to a time interval. On the corresponding BaseMetricValue instances, TimeStamp
            specifies the end of the time interval and Duration specifies its duration.
            4="StartupInterval": The metric applies to a time interval that began
            at the startup of the measured resource, that is, the ManagedElement associated
            by MetricDefForMe. On the corresponding BaseMetricValue instances, TimeStamp
            specifies the end of the time interval. The Duration value specifies the
            duration between the time when the resource started and the TimeStamp
            value. A Duration value of 0 indicates that the startup time of the measured
            resource is unknown.'
          nullable: true
          readOnly: true
          x-longDescription: 'TimeScope indicates the time scope to which the metric
            value applies. 0="Unknown": The time scope is not qualified by the metric
            designer or is unknown to the provider. 2="Point": The metric applies
            to a point in time. On the corresponding BaseMetricValue instances, TimeStamp
            specifies the point in time and Duration is always 0. 3="Interval": The
            metric applies to a time interval. On the corresponding BaseMetricValue
            instances, TimeStamp specifies the end of the time interval and Duration
            specifies its duration. 4="StartupInterval": The metric applies to a time
            interval that began at the startup of the measured resource, that is,
            the ManagedElement associated by MetricDefForMe. On the corresponding
            BaseMetricValue instances, TimeStamp specifies the end of the time interval.
            The Duration value specifies the duration between the time when the resource
            started and the TimeStamp value. A Duration value of 0 indicates that
            the startup time of the measured resource is unknown.'
