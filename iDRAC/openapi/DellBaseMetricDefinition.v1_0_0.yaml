        ProgrammaticUnits:
          description: ProgrammaticUnits identifies the specific units of a value.
            The value of this property is a legal value of the Programmatic Units
            qualifier as defined in Appendix C.1 of DSP0004 V2.4 or later.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: ProgrammaticUnits identifies the specific units of a
