        ChangeType:
          $ref: https://raw.githubusercontent.com/dell/DellRedfishSchemas/refs/heads/main/iDRAC/DellBaseMetricDefinition.yaml#/components/schemas/DellBaseMetricDefinition_ChangeType
          description: 'ChangeType indicates how the metric value changes, in the
            form of typical combinations of finer grain attributes such as direction
            change, minimum and maximum values, and wrapping semantics. 0="Unknown":
            The metric designer did not qualify the ChangeType. 2="N/A": If the "IsContinuous"
            property is "false", ChangeType does not apply and must be is set to "N/A".
            3="Counter": This is a counter metric. These metrics have non-negative
            integer values that increase monotonically till they reach the maximum
            representable number and then wrap around and start increasing from 0.
            Such counters, also known as rollover counters, can be used for instance
            to count the number of network errors or the number of transactions processed.
            The only way for a client application to keep track of wrap-arounds is
            to retrieve the value of the counter in appropriately short intervals.
            4="Gauge": This is a gauge metric. These metrics have integer or float
            values that can increase and decrease arbitrarily. A gauge must not wrap
            when it reaches the minimum or maximum representable number. Instead,
            the value "stays" at that number. Minimum or maximum values inside of
            the representable value range at which the metric value "stays", may not
            be defined. Vendors may extend this property in the vendor-reserved range.'
          nullable: true
          readOnly: true
          x-longDescription: 'ChangeType indicates how the metric value changes, in
            the form of typical combinations of finer grain attributes such as direction
            change, minimum and maximum values, and wrapping semantics. 0="Unknown":
            The metric designer did not qualify the ChangeType. 2="N/A": If the "IsContinuous"
            property is "false", ChangeType does not apply and must be is set to "N/A".
            3="Counter": This is a counter metric. These metrics have non-negative
            integer values that increase monotonically till they reach the maximum
            representable number and then wrap around and start increasing from 0.
            Such counters, also known as rollover counters, can be used for instance
            to count the number of network errors or the number of transactions processed.
            The only way for a client application to keep track of wrap-arounds is
            to retrieve the value of the counter in appropriately short intervals.
            4="Gauge": This is a gauge metric. These metrics have integer or float
            values that can increase and decrease arbitrarily. A gauge must not wrap
            when it reaches the minimum or maximum representable number. Instead,
            the value "stays" at that number. Minimum or maximum values inside of
            the representable value range at which the metric value "stays", may not
            be defined. Vendors may extend this property in the vendor-reserved range.'
        DataType:
          $ref: https://raw.githubusercontent.com/dell/DellRedfishSchemas/refs/heads/main/iDRAC/DellBaseMetricDefinition.yaml#/components/schemas/DellBaseMetricDefinition_DataType
          description: DataType identifies the data type of the metric. These types
            represent the datatypes defined for CIM.
          nullable: true
          readOnly: true
          x-longDescription: DataType identifies the data type of the metric. These
            types represent the datatypes defined for CIM.
        Description:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Description
          nullable: true
          readOnly: true
        ElementName:
          description: ElementName is the user-friendly name for the instance.
          nullable: true
          readOnly: true
          type: string
          x-longDescription: ElementName is the user-friendly name for the instance.
        GatheringType:
          $ref: https://raw.githubusercontent.com/dell/DellRedfishSchemas/refs/heads/main/iDRAC/DellBaseMetricDefinition.yaml#/components/schemas/DellBaseMetricDefinition_GatheringType
          description: 'GatheringType indicates how the metric values are gathered
            by the underlying instrumentation. This allows the client application
            to choose the right metric. 0="Unknown": The GatheringType is not known.
            2="OnChange": The CIM metric values get updated immediately when the values
            inside of the measured resource change. The values of OnChange metrics
            reflect the current state within the resource. An example is the number
            of users logged on, which gets updated immediately when users-log on or
            log-off. 3="Periodic": Indicates that the CIM metric values get updated
            periodically. For instance, to a client application, a metric value applying
            to the current time appears constant during each gathering interval, and
            then changes to the new value at the end of each gathering interval. 4="OnRequest":
            The CIM metric value is determined each time a client application reads
            it. The values of OnRequest metrics return the current state within the
            resource when requested. However, they do not change "unobserved", and
            therefore it is recommended that you do not subscribe for value changes
            of OnRequest metrics.'
          nullable: true
          readOnly: true
          x-longDescription: 'GatheringType indicates how the metric values are gathered
            by the underlying instrumentation. This allows the client application
            to choose the right metric. 0="Unknown": The GatheringType is not known.
            2="OnChange": The CIM metric values get updated immediately when the values
            inside of the measured resource change. The values of OnChange metrics
            reflect the current state within the resource. An example is the number
            of users logged on, which gets updated immediately when users-log on or
            log-off. 3="Periodic": Indicates that the CIM metric values get updated
            periodically. For instance, to a client application, a metric value applying
            to the current time appears constant during each gathering interval, and
            then changes to the new value at the end of each gathering interval. 4="OnRequest":
            The CIM metric value is determined each time a client application reads
            it. The values of OnRequest metrics return the current state within the
            resource when requested. However, they do not change "unobserved", and
            therefore it is recommended that you do not subscribe for value changes
            of OnRequest metrics.'
        Id:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Id
          readOnly: true
        IsContinuous:
          description: IsContinuous indicates whether the metric value is continuous
            or scalar. The value of this property is TRUE.
          nullable: true
          readOnly: true
          type: boolean
          x-longDescription: IsContinuous indicates whether the metric value is continuous
            or scalar. The value of this property is TRUE.
        Name:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Name
          readOnly: true
        Oem:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Oem
          description: The OEM extension property.
          x-longDescription: This property shall contain the OEM extensions.  All
            values for properties that this object contains shall conform to the Redfish
