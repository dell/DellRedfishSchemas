    DellUpdateService_v1_6_0_InstallStagedPackages:
      additionalProperties: false
      description: This action creates install jobs for all eligible firmware packages
        in the LocalImageStore collection. Supports @Redfish.OperationApplyTime (Immediate
        or OnReset).
      properties:
        '@Redfish.OperationApplyTimeSupport':
          $ref: http://redfish.dmtf.org/schemas/v1/Settings.yaml#/components/schemas/Settings_OperationApplyTimeSupport
          description: An indication of whether a client can request an apply time
            for a create, delete, or action operation of a resource through the OperationApplyTime
            term.
        target:
          description: Link to invoke action
          format: uri-reference
          type: string
        title:
          description: Friendly action name
          type: string
      type: object
      x-longDescription: This action accepts no package list parameter. Install jobs
        are created for all packages with PackageValidationStatus = Success in the
        LocalImageStore collection based on the operation apply time. The action supports
        @Redfish.OperationApplyTime with values Immediate (install now) or OnReset
        (install on next reboot).
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
      x-versionAdded: v1_5_0
    DellUpdateService_v1_6_0_InstallStagedPackagesRequestBody:
      additionalProperties: false
      description: This action creates install jobs for all eligible firmware packages
        in the LocalImageStore collection. Supports @Redfish.OperationApplyTime (Immediate
        or OnReset).
      properties:
        RebootHost:
          description: Whether to trigger a host reboot after update job creation.
          type: boolean
          x-longDescription: When set to true and ApplyTime is Immediate, the host
            system will be rebooted after all update jobs are created. When ApplyTime
            is OnReset, this parameter is ignored as the reboot will occur at the
            next scheduled system reset.
      type: object
      x-longDescription: This action accepts no package list parameter. Install jobs
        are created for all packages with PackageValidationStatus = Success in the
        LocalImageStore collection based on the operation apply time. The action supports
        @Redfish.OperationApplyTime with values Immediate (install now) or OnReset
        (install on next reboot).
