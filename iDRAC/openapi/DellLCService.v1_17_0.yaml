      additionalProperties: false
      deprecated: true
      description: The ReInitiateAutoDiscovery() method is used for reinitiating the
        discovery and handshake with static IP configuration. If the method successfully
        executes, iDRAC is in the static IP mode after the auto-discovery is initiated
        and thus, does not require DHCP setup. The static IP information for auto-discovery
        can be set either through the optional input parameters of this method or
        through the iDRAC attributes in the iDRAC Card Profile. After the successful
        auto-discovery initiation, if the IPAddress parameter has non-NULL value,
        the iDRAC IPv4 address is set to that parameter's value, otherwise the iDRAC
        IPv4 Address is set to the Address attribute in the IPv4 Information group
        in the iDRAC Card Profile. After the successful auto-discovery initiation,
        if the Mask parameter has a non-NULL value, the iDRAC IPv4 address net mask
        is set to that parameter's value, otherwise the iDRAC IPv4 address net mask
        is set to the to the Netmask attribute in the IPv4 Information group in the
        iDRAC Card Profile. After the successful auto-discovery initiation, if the
        Gateway parameter has non-NULL value, then the iDRAC IPv4 gateway address
        is set to that parameter's value, otherwise the iDRAC IPv4 gateway is set
        to the to the Gateway attribute in the IPv4 Information group in the iDRAC
        Card Profile. After the successful auto-discovery initiation, if the DNS parameter
        has non-NULL value, then the iDRAC IPv4 DNS address is set to that parameter's
        value, otherwise the iDRAC IPv4 DNS address is set to the to the DNS1 attribute
        in the IPv4 Information group in the iDRAC Card Profile. After the successful
        auto-discovery initiation, if the Domain parameter has non-NULL value, then
        the iDRAC domain name is set to that parameter's value, otherwise the iDRAC
        domain name is set to the to the DNSDomainName attribute in the NIC Information
        group in the iDRAC Card Profile.
